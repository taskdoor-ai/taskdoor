<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskDoor · 任务规划验证</title>
<style>
:root{color-scheme:light;--ink:#20242a;--muted:#717985;--line:#e5e8ed;--blue:#1670e8;--soft:#f5f8fc;--green:#237657;--amber:#936017;--red:#b03b3b}
*{box-sizing:border-box}body{margin:0;font:14px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:#fff}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #8db9f5;outline-offset:3px}
header{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:16px;background:#fff}h1{font-size:18px;letter-spacing:-.3px;margin:0}header p{margin:1px 0 0;color:var(--muted);font-size:12px}.brand{display:flex;gap:12px;align-items:center}.logo{width:38px;height:38px;display:grid;place-items:center;border:1px solid #d6e7ff;border-radius:11px;background:#eef6ff;color:var(--blue);font-weight:700}.stats{font-size:12px;color:var(--muted);text-align:right}
.shell{display:grid;grid-template-columns:292px minmax(0,1fr);height:calc(100vh - 76px)}aside{border-right:1px solid var(--line);background:#f8f9fb;display:flex;flex-direction:column;min-height:0}.filters{padding:20px 18px 14px;display:grid;gap:10px}.filters input,.filters select{width:100%;border:1px solid #dfe3e9;border-radius:9px;background:#fff;padding:9px 11px;color:var(--ink)}.case-list{overflow:auto;padding:0 10px 20px;display:flex;flex-direction:column;gap:4px}.case-button{border:1px solid transparent;background:transparent;border-radius:10px;padding:12px;text-align:left;width:100%;color:inherit}.case-button:hover{background:#eef2f7}.case-button[aria-current=true]{background:#eaf3ff;border-color:#d1e3fb}.case-code{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;gap:6px}.case-title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:5px;font-size:13px;line-height:1.6}.case-dot{color:var(--green)}
main{overflow:auto;padding:28px 38px 72px}.content{max-width:1140px;margin:0 auto}.eyebrow{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.page-title{font-size:25px;line-height:1.55;letter-spacing:-.45px;margin:12px 0 8px;font-weight:650}.badges{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 24px}.badge{font-size:12px;padding:4px 10px;border-radius:6px;background:#f1f4f8;color:#566174}.badge.good{color:var(--green);background:#ebf6f0}.badge.warn{color:var(--amber);background:#fff6e8}.badge.bad{color:var(--red);background:#fceeee}.badge.blue{color:#1966c6;background:#edf4ff}
.panel{border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin:18px 0;background:#fff}.panel.tint{background:linear-gradient(125deg,#f7fbff,#fff 75%)}.panel h2,.section-heading{font-size:16px;margin:0 0 14px;font-weight:650}.panel p{margin:6px 0 0}.muted{color:var(--muted)}.small{font-size:12px}details{border-top:1px solid var(--line);padding:12px 0}details:first-child{border-top:0}summary{cursor:pointer;color:#536171;list-style-position:outside;margin-left:16px}summary::marker{color:#92a1b4}.evidence{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.source-link{background:#f4f7fb;border:1px solid #e5eaf1;border-radius:5px;color:#526c8c;font-size:11px;padding:3px 7px;text-align:left;max-width:100%;overflow-wrap:anywhere}.reason-row{padding:13px 0;border-top:1px solid var(--line)}.reason-row:first-of-type{border-top:0;padding-top:0}.reason-row p{margin:0}.section-line{display:flex;align-items:center;justify-content:space-between;margin:28px 0 10px;gap:10px}.section-line h2{margin:0;font-size:17px}.change{margin:10px 0 16px;padding:20px 24px}.change-top{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}.change h3{margin:0;font-size:16px}.change-reason{font-size:13px;color:var(--muted);margin:7px 0 16px!important}.field-table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px}.field-table th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:9px 10px;border-bottom:1px solid var(--line)}.field-table td{padding:12px 10px;border-bottom:1px solid #edf0f3;vertical-align:top;overflow-wrap:anywhere}.field-table td:first-child{width:100px;color:var(--muted)}.field-table tr:last-child td{border-bottom:0}.old-value{color:#808996;width:38%}.new-value{background:#f7fbff}.field-lines{margin:0;padding:0;list-style:none}.field-lines li+li{margin-top:6px}.notice{border-left:3px solid #e2ba76;padding:10px 14px;background:#fffaf2;margin:12px 0;color:#7b5c2e;border-radius:0 8px 8px 0}.plain-list{padding-left:20px;margin:8px 0}.plain-list li{margin:7px 0}.preserved-row{display:flex;justify-content:space-between;gap:14px;font-size:13px;padding:7px 0}.action-label{display:inline-block;border:1px solid #d8e5f7;border-radius:7px;padding:6px 11px;color:#356ba4;background:#f8fbff;font-size:12px;margin:5px 7px 0 0}.footer{color:var(--muted);font-size:11px;margin:24px 0;overflow-wrap:anywhere}pre{margin:12px 0 0;padding:14px;background:#f5f7fa;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;max-height:500px;overflow:auto}.empty{padding:48px 12px;color:var(--muted);text-align:center}dialog{border:1px solid var(--line);border-radius:16px;padding:24px;width:min(760px,90vw);max-height:84vh;box-shadow:0 18px 90px #24345226}dialog::backdrop{background:#17293e50}dialog h2{font-size:17px;margin:0}.dialog-head{display:flex;justify-content:space-between;gap:20px;align-items:start}.close{background:#f1f4f8;border:0;border-radius:7px;padding:5px 11px;color:#546273}
@media(max-width:900px){.shell{grid-template-columns:240px minmax(0,1fr)}main{padding:24px 20px 60px}.panel{padding:18px}.old-value{width:32%}}
@media(max-width:650px){header{padding:0 16px}.stats{display:none}.shell{grid-template-columns:1fr;height:auto}aside{border-right:0;border-bottom:1px solid var(--line)}.filters{grid-template-columns:1fr 1fr;padding:12px}.case-list{max-height:190px;display:grid;grid-template-columns:1fr 1fr;padding:0 8px 10px}.case-button{padding:9px}.case-title{-webkit-line-clamp:1}main{overflow:visible;padding:20px 14px}.page-title{font-size:21px}.field-table{font-size:12px}.field-table td:first-child{width:60px}.field-table td,.field-table th{padding:9px 5px}.panel{padding:17px}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo" aria-hidden="true">A</div><div><h1>任务规划验证</h1><p>TaskDoor · 合成场景 / 只读回放 / 不创建真实任务</p></div></div><div id="stats" class="stats"></div></header>
<div class="shell"><aside aria-label="测试场景"><div class="filters"><input id="search" type="search" placeholder="搜索场景、行业或任务…" aria-label="搜索场景"><select id="suite" aria-label="选择场景类型"><option value="all">全部场景</option><option value="industry">六行业回归</option><option value="edge">边缘场景</option><option value="complex">复杂协作</option><option value="multiturn">连续多轮</option><option value="realistic">高拟真协作</option></select></div><nav id="case-list" class="case-list" aria-label="场景列表"></nav></aside><main id="main" tabindex="-1"><div id="content" class="content"></div></main></div>
<dialog id="source-dialog" aria-labelledby="source-title"><div class="dialog-head"><h2 id="source-title">判断依据</h2><button class="close" type="button" id="close-dialog" aria-label="关闭依据">关闭</button></div><div id="source-body"></div></dialog>
<script id="recorded-cases" type="application/json">__RECORDED_CASES__</script>
<script>
'use strict';
const cases=JSON.parse(document.getElementById('recorded-cases').textContent);
const disposition={ready_for_confirmation:'候选可审阅',needs_clarification:'需要补齐信息',route_required:'转到已有工作 / 查询',no_change:'无需变更'};
const intent={create:'新建结果',refine:'调整草稿',replan:'局部重规划',next_batch:'下一批工作',query:'查询',unclear:'明确需求'};
const suiteNames={industry:'六行业回归',edge:'边缘场景',complex:'复杂协作',multiturn:'连续多轮',realistic:'高拟真协作'};
const fields={title:'任务名称',goal:'目标',acceptanceCriteria:'完成标准',ownerRecommendation:'候选负责人',participantRecommendations:'参与贡献',schedule:'时间安排',estimate:'人类投入',dependsOnTaskIds:'前置依赖',tips:'执行建议'};
let selected=0;
function el(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined&&text!==null)node.textContent=text;return node}
function badge(text,tone){return el('span','badge '+(tone||''),text)}
function appendList(parent,items){const list=el('ul','plain-list');items.forEach(text=>list.append(el('li','',text)));parent.append(list)}
function sourceCatalog(c){const map=new Map([[c.input.requestId,{title:'本轮用户原文',text:c.input.message}]]);['tasks','stakeholders','discussions','history','files','sourceRefs'].forEach(key=>(c.input.context[key]||[]).forEach(item=>map.set(item.id,{...(map.get(item.id)||{}),...item})));(c.input.members||[]).forEach(member=>{map.set(member.id,member);(member.evidence||[]).forEach(record=>map.set(record.id,record))});return map}
function showSource(c,id){const source=sourceCatalog(c).get(id);document.getElementById('source-title').textContent=source?.title||source?.name||id;const body=document.getElementById('source-body');body.replaceChildren(el('p','small muted',id),el('pre','',source?JSON.stringify(source,null,2):'当前输入未提供此来源。'));document.getElementById('source-dialog').showModal()}
function references(c,ids){const group=el('div','evidence');(ids||[]).forEach(id=>{const button=el('button','source-link',id);button.type='button';button.addEventListener('click',()=>showSource(c,id));group.append(button)});return group}
function pretty(c,key,value){const tasks=new Map(c.input.context.tasks.map(t=>[t.id,t.title]));(c.output?.proposal?.changes||[]).forEach(change=>{if(change.fields.title)tasks.set(change.targetId,change.fields.title)});const members=new Map((c.input.members||[]).map(m=>[m.id,m.name]));if(value===undefined)return '本轮未提供';if(value===null)return '未知 / 未指定';if(key==='goal')return typeof value==='string'?value:value.text;if(key==='ownerRecommendation')return (value.memberId?members.get(value.memberId)||value.memberId:'尚无人选')+' · '+value.reason;if(key==='participantRecommendations')return value.length?value.map(p=>(members.get(p.memberId)||p.memberId)+'：'+p.contribution):'无新增参与贡献';if(key==='schedule')return [value.startOn?'开始 '+value.startOn:'开始待定',value.dueOn?'截止 '+value.dueOn:'截止待定',...(value.assumptions||[])];if(key==='estimate')return [value.ewdHours===null?'投入未知':value.ewdHours+' 小时（候选估计）',...(value.assumptions||[])];if(key==='dependsOnTaskIds')return value.length?value.map(id=>tasks.get(id)||id):'无前置任务';if(Array.isArray(value))return value;if(typeof value==='object')return JSON.stringify(value,null,2);return String(value)}
function valueCell(c,key,value,className){const cell=el('td',className);const text=pretty(c,key,value);if(Array.isArray(text)){const list=el('ul','field-lines');text.forEach(line=>list.append(el('li','',line)));cell.append(list)}else cell.textContent=text;return cell}
function previousValue(task,key){if(!task)return undefined;if(task[key]!==undefined)return task[key];if(key==='schedule')return {startOn:task.startOn||null,dueOn:task.dueOn||null,assumptions:[]};if(key==='ownerRecommendation'&&task.ownerId)return {memberId:task.ownerId,reason:'原正式负责人；本次候选不自动更换'};return undefined}
function renderChange(c,change){const old=c.input.context.tasks.find(t=>t.id===change.targetId);const card=el('section','panel change');const top=el('div','change-top');top.append(el('h3','',change.fields.title||old?.title||change.targetId),badge(change.action==='create'?'新增':'局部修改',change.action==='create'?'blue':''));card.append(top,el('p','change-reason',change.reason));const table=el('table','field-table');const thead=el('thead');const headrow=el('tr');headrow.append(el('th','','字段'));if(old)headrow.append(el('th','','当前记录'));headrow.append(el('th','','本轮候选'));thead.append(headrow);table.append(thead);const tbody=el('tbody');Object.entries(change.fields).forEach(([key,value])=>{const row=el('tr');row.append(el('td','',fields[key]||key));if(old)row.append(valueCell(c,key,previousValue(old,key),'old-value'));row.append(valueCell(c,key,value,'new-value'));tbody.append(row)});table.append(tbody);card.append(table,references(c,change.evidenceRefs));return card}
function render(){const c=cases[selected];const content=document.getElementById('content');content.replaceChildren();if(!c){content.append(el('p','empty','暂无已记录的场景。'));return}const o=c.output;const eye=el('div','eyebrow');eye.append(el('span','',suiteNames[c.suite]+' / '+c.id+' / '+c.industry),el('span','','快照 '+c.input.context.snapshotId+' · r'+c.input.revision));content.append(eye,el('h2','page-title',o?.summary||'尚未记录模型输出'));const badges=el('div','badges');if(o){badges.append(badge(intent[o.intent]||o.intent),badge(disposition[o.disposition]||o.disposition,o.disposition==='ready_for_confirmation'?'blue':'warn'))}badges.append(badge(c.structural?.status==='structurally_valid'?'机器检查通过':c.structural?'机器检查需查看':'机器检查未记录',c.structural?.status==='structurally_valid'?'good':'warn'));const semantic=c.semantic?.status;badges.append(badge(semantic==='passed'?'独立 agent 复核通过':semantic==='failed'?'独立复核发现问题':'独立复核未记录',semantic==='passed'?'good':semantic==='failed'?'bad':'warn'));content.append(badges);
const input=el('details');input.append(el('summary','','查看本轮用户输入与测试条件'),el('p','',c.input.message),el('p','small muted','所有企业、人员、任务、回执均为合成资料；不能作为真实业务批准。'),el('pre','',JSON.stringify({currentDate:c.input.currentDate,timezone:c.input.timezone,coverage:c.input.context.coverage,duplicateSearch:c.input.duplicateSearch},null,2)));content.append(input);if(!o)return;
const rationale=el('section','panel tint');rationale.append(el('h2','','本轮判断依据'));if(!o.reasoningSummary.length)rationale.append(el('p','muted','本轮没有额外判断依据。'));o.reasoningSummary.forEach(reason=>{const row=el('div','reason-row');row.append(el('p','',reason.text),references(c,reason.evidenceRefs));rationale.append(row)});content.append(rationale);
if(o.questions.length){const questions=el('section','panel');questions.append(el('h2','','只需补充这些信息'));appendList(questions,o.questions.map(q=>q.question+(q.blocking?'（阻塞本轮）':'')));content.append(questions)}
const changes=o.proposal?.changes||[];const heading=el('div','section-line');heading.append(el('h2','','本轮候选差异'),el('span','small muted',changes.filter(x=>x.action==='create').length+' 新增 · '+changes.filter(x=>x.action==='update').length+' 修改'));content.append(heading);if(!changes.length)content.append(el('div','panel muted','没有新增或修改操作。已有任务不会被重复创建。'));changes.forEach(change=>content.append(renderChange(c,change)));
const preservedIds=o.proposal?.preservedTaskIds||c.input.context.tasks.map(t=>t.id);if(preservedIds.length){const preserved=el('details');preserved.append(el('summary','','沿用 / 保持不变的已有工作 · '+preservedIds.length+' 项'));preservedIds.forEach(id=>{const task=c.input.context.tasks.find(t=>t.id===id);const row=el('div','preserved-row');row.append(el('span','',task?.title||id),el('span','muted small',task?.status||''));preserved.append(row)});content.append(preserved)}
if(o.warnings.length){const warnings=el('div','notice');appendList(warnings,o.warnings);content.append(warnings)}if(o.nextActions.length){const actions=el('section','panel');actions.append(el('h2','','建议的下一步'));o.nextActions.forEach(action=>actions.append(el('span','action-label',action.label)));actions.append(el('p','small muted','只显示规划建议，此回放页不执行任何操作。'));content.append(actions)}
const review=el('details');review.append(el('summary','','查看复核记录与结构化输出'));if(c.semantic)review.append(el('pre','',JSON.stringify(c.semantic,null,2)));if(c.structural?.errors?.length)review.append(el('pre','',JSON.stringify(c.structural.errors,null,2)));review.append(el('pre','',JSON.stringify(o,null,2)));content.append(review,el('p','footer','原始记录：'+c.source+' · 本页不联网，不调用模型；复核来自独立 agent，未经行业用户验证。'));document.getElementById('main').scrollTop=0;renderList()}
function renderList(){const query=document.getElementById('search').value.trim().toLowerCase();const suite=document.getElementById('suite').value;const list=document.getElementById('case-list');list.replaceChildren();cases.forEach((c,index)=>{if(suite!=='all'&&c.suite!==suite)return;if(query&&!JSON.stringify([c.id,c.industry,c.input.message,c.output?.summary]).toLowerCase().includes(query))return;const button=el('button','case-button');button.type='button';button.setAttribute('aria-current',String(index===selected));const code=el('span','case-code');code.append(el('span','',c.id+' · '+c.industry));if(c.semantic?.status==='passed')code.append(el('span','case-dot','✓'));button.append(code,el('span','case-title',c.output?.summary||c.input.message));button.addEventListener('click',()=>{selected=index;render()});list.append(button)});if(!list.childElementCount)list.append(el('p','empty','没有匹配场景。'))}
document.getElementById('stats').textContent=cases.length+' 个记录 · '+cases.filter(c=>c.output).length+' 份答案 · '+cases.filter(c=>c.semantic).length+' 份复核';document.getElementById('search').addEventListener('input',renderList);document.getElementById('suite').addEventListener('change',renderList);document.getElementById('close-dialog').addEventListener('click',()=>document.getElementById('source-dialog').close());render();
</script>
</body>
</html>
