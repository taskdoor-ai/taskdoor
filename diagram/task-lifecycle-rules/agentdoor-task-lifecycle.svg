<circle cx="509" cy="413" r="3" fill="#7891b1"/>
<path d="M809 369L809 414" fill="none" stroke="#49617e" stroke-width="1.5" stroke-dasharray="4 6"/>
<circle cx="809" cy="413" r="3" fill="#7891b1"/>
