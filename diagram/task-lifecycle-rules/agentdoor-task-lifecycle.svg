<path d="M1251 316L1266 316" fill="none" stroke="#8ca1bc" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M1551 316L1566 316" fill="none" stroke="#8ca1bc" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M1851 316L1866 316" fill="none" stroke="#8ca1bc" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M209 369L209 414" fill="none" stroke="#49617e" stroke-width="1.5" stroke-dasharray="4 6"/>
<circle cx="209" cy="413" r="3" fill="#7891b1"/>
