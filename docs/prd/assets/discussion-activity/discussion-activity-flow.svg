<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">讨论、活动与通知的信息边界</title>
  <desc id="desc">人的交流写入讨论并直接产生通知，业务操作形成变更集和领域事件，再投影为只读活动与通知。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/></marker>
    <style>.title{font:700 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#667085}.head{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#24324a}.body{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475467}.line{stroke:#667085;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#98a2b3;stroke-width:2;stroke-dasharray:7 7;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="960" height="600" rx="28" fill="#f8fafc"/>
  <text class="title" x="56" y="64">交流、事实与提醒各有其位</text>
  <text class="sub" x="56" y="94">通知负责定位，不替代来源对象的业务状态</text>

  <rect x="56" y="142" width="180" height="112" rx="18" fill="#eef4ff" stroke="#84adff"/><text class="head" x="80" y="180">人的交流操作</text><text class="body" x="80" y="208">发布 · 回复 · 提及</text><text class="body" x="80" y="232">附件 · 文件原文讨论</text>
  <path class="line" d="M236 198 H300"/>
  <rect x="302" y="142" width="180" height="112" rx="18" fill="#fff" stroke="#84adff"/><text class="head" x="330" y="180">Discussion</text><text class="body" x="330" y="208">可编辑自己的消息</text><text class="body" x="330" y="232">删除保留 tombstone</text>

  <rect x="56" y="326" width="180" height="112" rx="18" fill="#fff4ed" stroke="#fdb022"/><text class="head" x="80" y="364">业务操作</text><text class="body" x="80" y="392">任务 · 邀请 · 文件</text><text class="body" x="80" y="416">Commit · 状态 · 完成</text>
  <path class="line" d="M236 382 H300"/>
  <rect x="302" y="326" width="180" height="112" rx="18" fill="#fff" stroke="#fdb022"/><text class="head" x="330" y="364">ChangeSet</text><text class="body" x="330" y="392">业务对象与领域事件</text><text class="body" x="330" y="416">同一事务提交</text>
  <path class="line" d="M482 382 H546"/>
  <rect x="548" y="326" width="180" height="112" rx="18" fill="#ecfdf3" stroke="#6ce9a6"/><text class="head" x="576" y="364">Activity</text><text class="body" x="576" y="392">只读事件投影</text><text class="body" x="576" y="416">不可手工增删改</text>

  <path class="dash" d="M482 198 H770 V280"/><path class="dash" d="M728 382 H770 V324"/>
  <rect x="740" y="246" width="164" height="112" rx="18" fill="#f3f0ff" stroke="#a48afb"/><text class="head" x="768" y="284">Notification</text><text class="body" x="768" y="312">个人提醒 · 已读</text><text class="body" x="768" y="336">保存来源深链</text>
  <path class="dash" d="M822 358 V464"/>
  <rect x="638" y="466" width="266" height="72" rx="16" fill="#fff" stroke="#98a2b3"/><text class="head" x="680" y="496">来源对象重新鉴权</text><text class="body" x="672" y="520">Discussion · Task · File · 邀请</text>
  <text class="body" x="56" y="564">讨论直达通知且不生成 Activity · 根讨论删除保留回复 · 投影延迟不等于操作失败</text>
</svg>
