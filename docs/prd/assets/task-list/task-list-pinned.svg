    <path d="M13 9h14l-3 9 6 6H10l6-6z"/>
    <path d="M20 24v14" stroke-linecap="round"/>
  </g>
  <rect x="108" y="442" width="744" height="76" rx="14" fill="#ffffff" stroke="#e5e8ef"/>
  <circle cx="146" cy="480" r="18" fill="#e98c5b"/>
  <text x="180" y="475" font-family="system-ui, sans-serif" font-size="21" font-weight="650" fill="#293042">补充任务详情验收标准</text>
  <text x="180" y="499" font-family="system-ui, sans-serif" font-size="15" fill="#7b8494">AgentDoor · 昨天</text>
