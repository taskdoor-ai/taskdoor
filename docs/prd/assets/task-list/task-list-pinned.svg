  <text x="180" y="265" font-family="system-ui, sans-serif" font-size="15" fill="#7b8494">AgentDoor · 刚刚更新</text>
  <g transform="translate(792 226) rotate(45 20 20)" fill="none" stroke="#7559d9" stroke-width="3" stroke-linejoin="round">
    <path d="M13 9h14l-3 9 6 6H10l6-6z" fill="#eee9ff"/>
    <path d="M20 24v14" stroke-linecap="round"/>
  </g>
  <text x="110" y="330" font-family="system-ui, sans-serif" font-size="20" font-weight="650" fill="#8b93a1">最近任务</text>
  <rect x="108" y="350" width="744" height="76" rx="14" fill="#ffffff" stroke="#e5e8ef"/>
  <circle cx="146" cy="388" r="18" fill="#50a889"/>
  <text x="180" y="383" font-family="system-ui, sans-serif" font-size="21" font-weight="650" fill="#293042">完善筛选面板交互</text>
  <text x="180" y="407" font-family="system-ui, sans-serif" font-size="15" fill="#7b8494">AgentDoor · 12 分钟前</text>
