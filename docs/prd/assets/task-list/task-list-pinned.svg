<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">任务列表置顶功能示意</title>
  <desc id="desc">任务列表顶部显示置顶区，任务行右侧在悬停或聚焦时显示图钉操作。</desc>
  <rect width="960" height="600" rx="32" fill="#f6f7fb"/>
  <rect x="76" y="54" width="808" height="492" rx="20" fill="#ffffff" stroke="#dce1eb" stroke-width="2"/>
  <rect x="108" y="86" width="744" height="58" rx="14" fill="#f4f6fa"/>
  <circle cx="140" cy="115" r="11" fill="none" stroke="#667085" stroke-width="4"/>
  <path d="m148 123 10 10" stroke="#667085" stroke-width="4" stroke-linecap="round"/>
  <text x="178" y="123" font-family="system-ui, sans-serif" font-size="23" fill="#87909f">搜索任务</text>
  <text x="110" y="190" font-family="system-ui, sans-serif" font-size="20" font-weight="650" fill="#8b93a1">置顶</text>
  <rect x="108" y="208" width="744" height="76" rx="14" fill="#fff8e8" stroke="#f0dca8"/>
  <circle cx="146" cy="246" r="18" fill="#7559d9"/>
