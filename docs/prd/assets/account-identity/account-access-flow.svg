<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">登录、注册与密码恢复</title>
<desc id="desc">登录校验凭据后进入已认证状态；注册必须验证邮箱；找回密码经过一次性凭证重置密码再返回登录。已认证后检查团队。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#53666c"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#23363c} .heading{font-size:25px;font-weight:650}.label{font-size:17px;font-weight:600}.body{font-size:15px}.small{font-size:13px;fill:#53666c}.line{stroke:#53666c;stroke-width:2;fill:none;marker-end:url(#arrow)}.guide{stroke:#d2ddda;stroke-width:1.5;fill:none}.node{fill:#e8f2ee;stroke:#6b8c80;stroke-width:1.5}.muted{fill:#f2f5f4;stroke:#c3d1cc;stroke-width:1.5}</style>
<rect width="960" height="600" fill="#fbfcfa"/>
<text x="40" y="49" class="heading">登录、注册与密码恢复</text><text x="40" y="83" class="body" text-anchor="start">目标流程｜未验证邮箱不能创建、加入团队或进入工作区</text><text x="42" y="158" class="label" text-anchor="start">登录</text><path d="M151 152 H196" class="line"/><rect x="210" y="121" width="380" height="66" rx="8" class="node"/><text x="400" y="160" class="body" text-anchor="middle">邮箱与密码校验</text><text x="42" y="278" class="label" text-anchor="start">注册</text><path d="M151 272 H196" class="line"/><rect x="210" y="241" width="380" height="66" rx="8" class="node"/><text x="400" y="280" class="body" text-anchor="middle">姓名、邮箱、密码 → 验证邮箱</text><text x="42" y="398" class="label" text-anchor="start">忘记密码</text><path d="M151 392 H196" class="line"/><rect x="210" y="361" width="380" height="66" rx="8" class="node"/><text x="400" y="400" class="body" text-anchor="middle">通用响应 → 凭证校验 → 重置密码</text><path d="M590 152 H665 V270 H695" class="line"/><path d="M590 272 H695" class="line"/><rect x="710" y="242" width="198" height="64" rx="8" class="node"/><text x="809" y="280" class="label" text-anchor="middle">已认证</text><path d="M809 307 V386" class="line"/><text x="809" y="416" class="label" text-anchor="middle">恢复有效团队</text><text x="809" y="446" class="small" text-anchor="middle">无团队 → 创建或加入</text><path d="M400 424 V484 H180 V199 H245" class="line"/><text x="231" y="507" class="small" text-anchor="start">重置成功 → 撤销旧 Web 会话 → 返回登录</text><text x="42" y="119" class="small" text-anchor="start">统一失败提示</text><text x="211" y="321" class="small" text-anchor="start">6 位验证码 · 10 分钟有效 · 30 秒后可重发</text><path d="M40 551 H920" class="guide"/><text x="40" y="579" class="small">FIG-AUTH-001 · 目标流程示意 · 服务端校验身份、有效期、尝试次数与会话</text></svg>
