<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">工作区导航</title>
<desc id="desc">顶部提供团队切换、连接 AI 或 CLI、通知和个人中心。下方左侧为任务索引与我的工作，右侧为当前内容。团队设置按角色展示允许动作，窄屏单面板返回。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#53666c"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#23363c} .heading{font-size:25px;font-weight:650}.label{font-size:17px;font-weight:600}.body{font-size:15px}.small{font-size:13px;fill:#53666c}.line{stroke:#53666c;stroke-width:2;fill:none;marker-end:url(#arrow)}.guide{stroke:#d2ddda;stroke-width:1.5;fill:none}.node{fill:#e8f2ee;stroke:#6b8c80;stroke-width:1.5}.muted{fill:#f2f5f4;stroke:#c3d1cc;stroke-width:1.5}</style>
<rect width="960" height="600" fill="#fbfcfa"/>
<text x="40" y="49" class="heading">工作区导航</text><text x="40" y="84" class="body" text-anchor="start">目标信息架构｜读取、导航和写入都以当前有效团队为范围</text><rect x="40" y="116" width="880" height="76" rx="8" class="muted"/><text x="68" y="162" class="label" text-anchor="start">当前团队 ▾</text><text x="326" y="162" class="label" text-anchor="start">连接 AI / CLI</text><text x="612" y="162" class="label" text-anchor="start">通知</text><text x="786" y="162" class="label" text-anchor="start">个人中心</text><path d="M283 130 V177 M566 130 V177 M744 130 V177" class="guide"/><rect x="40" y="220" width="264" height="220" rx="8" class="muted"/><text x="64" y="254" class="label" text-anchor="start">任务索引</text><text x="64" y="290" class="body" text-anchor="start">搜索 · 筛选 · 新建</text><text x="64" y="330" class="body" text-anchor="start">我的工作（默认）</text><text x="64" y="370" class="body" text-anchor="start">置顶与任务列表</text><text x="64" y="410" class="small" text-anchor="start">保留查询与滚动位置</text><rect x="332" y="220" width="588" height="220" rx="8" class="node"/><text x="360" y="254" class="label" text-anchor="start">当前内容</text><text x="360" y="297" class="body" text-anchor="start">我的工作 → 打开原任务详情</text><text x="360" y="335" class="body" text-anchor="start">任务详情 → 讨论 / 子任务 / 文件 / 活动</text><text x="360" y="374" class="body" text-anchor="start">通知 → 重新鉴权 → 来源对象</text><text x="360" y="413" class="small" text-anchor="start">无权或来源不存在 → 返回工作区</text><path d="M306 330 H324" class="line"/><text x="40" y="478" class="body" text-anchor="start">个人中心 → 团队设置：管理员管理；成员查看允许的团队资料。</text><text x="40" y="510" class="body" text-anchor="start">窄屏：列表 → 单面板内容 → 返回原位置；权限失效立即收口。</text><path d="M40 551 H920" class="guide"/><text x="40" y="579" class="small">FIG-WORK-001 · 目标信息架构示意 · 首次空工作区：创建任务 / 邀请成员 / 连接 CLI</text></svg>
