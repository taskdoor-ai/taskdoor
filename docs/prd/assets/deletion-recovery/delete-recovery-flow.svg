<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Task 与 File 的删除、恢复与清理流程</title>
  <desc id="desc">Web 和 CLI 先取得对象各自的影响预览，再绑定版本和摘要确认删除。Task 与 File 进入独立三十天回收记录后可以恢复或按期清理，正式提交、活动和审计保留。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .subtitle { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .step { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #26334d; }
      .body { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #536179; }
      .small { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #40516d; }
      .line { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="960" height="600" rx="24" fill="#f8fafc"/>
  <text x="54" y="58" class="title">任务与文件删除、恢复流程</text>
  <text x="54" y="86" class="subtitle">共用安全原则，分别保存预览、权限、版本、影响摘要和回收记录</text>

  <rect x="54" y="128" width="188" height="126" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="84" cy="158" r="15" fill="#dbeafe"/>
  <text x="79" y="164" class="small">1</text>
  <text x="108" y="164" class="step">影响预览</text>
  <text x="74" y="196" class="body">Task / File 最新版本</text>
  <text x="74" y="219" class="body">后代／依赖 或 版本／引用</text>
  <text x="74" y="242" class="body">生成 impact_digest</text>

  <path d="M 242 191 L 281 191" class="line"/>
  <rect x="282" y="128" width="188" height="126" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="312" cy="158" r="15" fill="#fef3c7"/>
  <text x="307" y="164" class="small">2</text>
  <text x="336" y="164" class="step">明确确认</text>
  <text x="302" y="196" class="body">选择后代级联范围</text>
  <text x="302" y="219" class="body">版本 + 摘要 + 幂等键</text>
  <text x="302" y="242" class="body">变化即拒绝并重新预览</text>

  <path d="M 470 191 L 509 191" class="line"/>
  <rect x="510" y="128" width="188" height="126" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="540" cy="158" r="15" fill="#ffedd5"/>
  <text x="535" y="164" class="small">3</text>
  <text x="564" y="164" class="step">逻辑删除</text>
  <text x="530" y="196" class="body">正常查询立即隐藏</text>
  <text x="530" y="219" class="body">关系失效 · 草稿冻结</text>
  <text x="530" y="242" class="body">原子回执与 Activity</text>

  <path d="M 698 191 L 737 191" class="line"/>
  <rect x="738" y="128" width="168" height="126" rx="18" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="768" cy="158" r="15" fill="#fed7aa"/>
  <text x="763" y="164" class="small">4</text>
  <text x="792" y="164" class="step">30 天回收站</text>
  <text x="758" y="196" class="body">Task / File 独立记录</text>
  <text x="758" y="219" class="body">显示计划清理时间</text>
  <text x="758" y="242" class="body">过期后不可恢复</text>

  <path d="M 822 254 L 822 315 L 691 315 L 691 354" class="line"/>
  <path d="M 822 254 L 822 315 L 859 315 L 859 354" class="line"/>
  <rect x="582" y="356" width="220" height="118" rx="18" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="606" y="394" class="step">清理前恢复</text>
  <text x="606" y="425" class="body">重验 ACL · 配额 · 关系</text>
  <text x="606" y="448" class="body">合法且明确选择的引用恢复</text>

  <rect x="816" y="356" width="110" height="118" rx="18" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
  <text x="840" y="394" class="step">到期清理</text>
  <text x="836" y="425" class="body">正文与草稿</text>
  <text x="836" y="448" class="body">展示缓存</text>

  <path d="M 691 474 L 691 516" class="line"/>
  <path d="M 870 474 L 870 516 L 691 516" stroke="#64748b" stroke-width="2.5" fill="none"/>
  <rect x="54" y="516" width="652" height="52" rx="14" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="78" y="548" class="small">始终保留：正式 Commit · 必要 Activity / ChangeSet · 安全审计；永久清理后不可恢复</text>
</svg>
