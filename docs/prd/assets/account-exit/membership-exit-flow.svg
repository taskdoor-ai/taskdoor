<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">成员离开、被移除与账号停用流程</title>
  <desc id="desc">退出动作先区分会话、团队成员关系与账号。正常 Owner 走转移；只有失联死锁才由管理员经增强认证、预览、理由和审计恢复为已同意成员或未分配，再撤销访问。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .subtitle { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .step { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #26334d; }
      .body { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #536179; }
      .small { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #40516d; }
      .line { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="960" height="600" rx="24" fill="#f8fafc"/>
  <text x="54" y="58" class="title">离开团队与停用账号</text>
  <text x="54" y="86" class="subtitle">退出登录与切换团队不进入责任收口；离开、移除和停用必须重新校验</text>

  <rect x="54" y="120" width="210" height="98" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="78" y="156" class="step">选择动作</text>
  <text x="78" y="184" class="body">离开团队 · 移除成员 · 停用账号</text>
  <path d="M 264 169 L 310 169" class="line"/>

  <rect x="312" y="120" width="250" height="98" rx="18" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="336" y="156" class="step">责任检查</text>
  <text x="336" y="184" class="body">有效 Owner · 待处理邀请 · 设备 scope</text>
  <path d="M 562 169 L 608 169" class="line"/>

  <rect x="610" y="120" width="296" height="98" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="634" y="156" class="step">管理员检查</text>
  <text x="634" y="184" class="body">唯一管理员必须先指定另一位有效管理员</text>

  <path d="M 758 218 L 758 270 L 655 270 L 655 310" class="line"/>
  <path d="M 758 218 L 758 270 L 852 270 L 852 310" class="line"/>
  <text x="617" y="260" class="small">可处理</text>
  <text x="820" y="260" class="small">仍阻断</text>

  <rect x="520" y="312" width="270" height="112" rx="18" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="546" y="350" class="step">正常转移／死锁恢复</text>
  <text x="546" y="379" class="body">新 Owner 已接受，或明确恢复为 null</text>
  <text x="546" y="402" class="body">step-up · 预览 · 理由 · 审计</text>

  <rect x="808" y="312" width="118" height="112" rx="18" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
  <text x="836" y="350" class="step">阻止</text>
  <text x="830" y="379" class="body">定位任务或</text>
  <text x="830" y="402" class="body">管理员缺口</text>

  <path d="M 655 424 L 655 468" class="line"/>
  <rect x="472" y="470" width="366" height="92" rx="18" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
  <text x="498" y="506" class="step">撤权后结束</text>
  <text x="498" y="534" class="body">撤销 Web 会话范围与 CLI 设备授权 → 离开／移除／停用</text>

  <rect x="54" y="312" width="360" height="250" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="80" y="350" class="step">不进入责任收口的动作</text>
  <rect x="80" y="374" width="308" height="66" rx="14" fill="#f1f5f9"/>
  <text x="100" y="402" class="small">退出登录</text>
  <text x="100" y="425" class="body">仅结束当前会话，不删除云端事实</text>
  <rect x="80" y="454" width="308" height="66" rx="14" fill="#f1f5f9"/>
  <text x="100" y="482" class="small">切换团队</text>
  <text x="100" y="505" class="body">清空旧上下文后加载新团队</text>
  <text x="80" y="546" class="small">历史 Owner · Discussion · Commit · Activity 保留</text>
</svg>
