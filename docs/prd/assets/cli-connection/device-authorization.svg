<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">CLI 设备授权流程</title>
<desc id="desc">用户运行登录，CLI 请求短验证码并打开浏览器。用户核对账号、团队与权限后批准，服务签发设备授权，CLI 领取凭据。后续任务 API 每次重新鉴权，撤销后调用失败。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#53666c"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#23363c} .heading{font-size:25px;font-weight:650}.label{font-size:17px;font-weight:600}.body{font-size:15px}.small{font-size:13px;fill:#53666c}.line{stroke:#53666c;stroke-width:2;fill:none;marker-end:url(#arrow)}.guide{stroke:#d2ddda;stroke-width:1.5;fill:none}.node{fill:#e8f2ee;stroke:#6b8c80;stroke-width:1.5}.muted{fill:#f2f5f4;stroke:#c3d1cc;stroke-width:1.5}</style>
<rect width="960" height="600" fill="#fbfcfa"/>
<text x="40" y="49" class="heading">CLI 设备授权流程</text><text x="40" y="81" class="body" text-anchor="start">目标时序｜短码单次、短时有效；用户无需复制长期 Token</text><text x="104" y="120" class="label" text-anchor="middle">用户</text><path d="M104 136 V533" class="guide"/><text x="330" y="120" class="label" text-anchor="middle">CLI</text><path d="M330 136 V533" class="guide"/><text x="561" y="120" class="label" text-anchor="middle">浏览器</text><path d="M561 136 V533" class="guide"/><text x="830" y="120" class="label" text-anchor="middle">服务</text><path d="M830 136 V533" class="guide"/><path d="M104 166 H330" class="line"/><text x="217" y="157" class="small" text-anchor="middle">运行 taskdoor login</text><path d="M330 210 H830" class="line"/><text x="580" y="201" class="small" text-anchor="middle">申请设备会话 ← 验证地址、短验证码与截止时间</text><path d="M330 254 H561" class="line"/><text x="445.5" y="245" class="small" text-anchor="middle">打开浏览器</text><path d="M104 298 H561" class="line"/><text x="332.5" y="289" class="small" text-anchor="middle">登录并核对账号 / 团队 / 权限范围</text><path d="M561 342 H830" class="line"/><text x="695.5" y="333" class="small" text-anchor="middle">用户批准，服务记录设备授权</text><path d="M830 386 H330" class="line"/><text x="580" y="377" class="small" text-anchor="middle">受控领取 → 本机安全保存设备凭据</text><path d="M330 430 H104" class="line"/><text x="217" y="421" class="small" text-anchor="middle">终端显示已连接</text><path d="M330 474 H830" class="line"/><text x="580" y="465" class="small" text-anchor="middle">绑定任务 → API 调用 → 每次重新校验</text><text x="483" y="524" class="small" text-anchor="middle">拒绝 / 过期 → 重新发起；撤销后 → 下一次调用失败</text><path d="M40 551 H920" class="guide"/><text x="40" y="579" class="small">FIG-CLI-001 · 目标流程示意 · 审计记录设备、实际 actor 与 on-behalf-of 成员</text></svg>
