<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">本地文件到正式 Commit 的提交闭环</title>
  <desc id="desc">本地文件经上传准备和安全扫描；同步形成可用版本，异步首事务形成处理中的版本与任务引用。规范 File 删除进入独立三十天回收并选择性恢复合法引用；正式 Commit 与完成任务仍为独立动作。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/></marker>
    <style>.title{font:700 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.sub{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#667085}.head{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#24324a}.body{font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#667085}.line{stroke:#667085;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#98a2b3;stroke-width:2;stroke-dasharray:7 7;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="960" height="600" rx="28" fill="#f8fafc"/>
  <text class="title" x="56" y="64">本地结果先审阅，再沉淀</text>
  <text class="sub" x="56" y="94">Web 与 CLI 共用文件版本、权限、幂等和回执</text>

  <g transform="translate(46 154)">
    <rect width="126" height="86" rx="16" fill="#eef4ff" stroke="#84adff"/><text class="head" x="26" y="35">本地文件</text><text class="body" x="18" y="61">用户明确选择</text>
    <path class="line" d="M126 43 H164"/><rect x="166" width="126" height="86" rx="16" fill="#fff" stroke="#84adff"/><text class="head" x="190" y="35">上传准备</text><text class="body" x="185" y="61">摘要 · 会话</text>
    <path class="line" d="M292 43 H330"/><rect x="332" width="126" height="86" rx="16" fill="#fff" stroke="#84adff"/><text class="head" x="357" y="35">字节上传</text><text class="body" x="353" y="61">受控目标</text>
    <path class="line" d="M458 43 H496"/><rect x="498" width="126" height="86" rx="16" fill="#fff4ed" stroke="#fdb022"/><text class="head" x="528" y="35">安全扫描</text><text class="body" x="520" y="61">处理状态可查</text>
    <path class="line" d="M624 43 H662"/><rect x="664" width="126" height="86" rx="16" fill="#ecfdf3" stroke="#6ce9a6"/><text class="head" x="687" y="35">FileVersion</text><text class="body" x="684" y="61">可用后再引用</text>
  </g>

  <text class="body" x="56" y="270">同步：available、Placement、ChangeSet 与 Activity 同事务</text>
  <text class="body" x="56" y="292">异步：202 + processing 及同组对象；后续扫描只推进状态并追加 Activity</text>
  <path class="line" d="M773 240 V312 H238 V326"/>
  <rect x="142" y="328" width="192" height="104" rx="18" fill="#f3f0ff" stroke="#a48afb"/><text class="head" x="174" y="366">TaskCommitDraft</text><text class="body" x="174" y="392">可创建 · 编辑 · 删除</text><text class="body" x="174" y="414">引用明确文件版本</text>
  <path class="line" d="M334 380 H398"/>
  <rect x="400" y="328" width="192" height="104" rx="18" fill="#fff" stroke="#98a2b3"/><text class="head" x="434" y="366">提交前复核</text><text class="body" x="434" y="392">权限 · 任务版本</text><text class="body" x="434" y="414">文件版本 · 证据</text>
  <path class="line" d="M592 380 H656"/>
  <rect x="658" y="328" width="192" height="104" rx="18" fill="#ecfdf3" stroke="#6ce9a6"/><text class="head" x="698" y="366">TaskCommit</text><text class="body" x="690" y="392">不可变 · 产生 Activity</text><text class="body" x="700" y="414">更正用 supersede</text>
  <path class="dash" d="M754 432 V488 H592"/>
  <rect x="386" y="458" width="206" height="80" rx="18" fill="#fff" stroke="#f97066"/><text class="head" x="433" y="490">完成任务</text><text class="body" x="416" y="516">后续独立核对与确认</text>
  <text class="body" x="56" y="566">File 删除独立 30 天回收；正式 Commit 不删除，也不自动改变 TaskStatus 或完成度</text>
</svg>
