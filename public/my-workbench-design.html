<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>我的工作 · TaskDoor 设计稿</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231268d6'/%3E%3Cpath d='M10 25V7h12v18M7 25h18M18 16h1' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
  <style>
    /* Independent, throwaway design proposal. No application storage or production API.
       Reuses the palette, type scale and shapes in styles/agentdoor-tokens.css.
       Question: what task information helps an owner decide what to do next?
       Proposal: one action list, with reasons and traceable evidence; no second task truth. */
    :root {
      --ad-canvas:#fff; --ad-surface:#fff; --ad-surface-quiet:#fafafa;
      --ad-surface-subtle:#f3f3f2; --ad-sidebar:#f7f7f6;
      --ad-ink:#17191c; --ad-ink-secondary:#565a60; --ad-ink-tertiary:#6b7077;
      --ad-border:#dcd8d1; --ad-border-soft:#ebe8e3;
      --ad-route:#1268d6; --ad-route-hover:#0d57b5; --ad-route-soft:#e7f1fd; --ad-route-ink:#0a438e;
      --ad-danger:#b43a35; --ad-danger-soft:#fce9e7; --ad-inference:#8a5a13; --ad-fact:#24735a;
      --ad-font-sans:"Geist Variable","Noto Sans SC","PingFang SC","Microsoft YaHei",ui-sans-serif,system-ui,sans-serif;
      --ad-font-mono:"IBM Plex Mono","SFMono-Regular",Consolas,ui-monospace,monospace;
      --ad-radius-control:8px; --ad-radius-card:12px; --sidebar-width:284px;
    }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    body { margin:0; color:var(--ad-ink); background:var(--ad-canvas); font:14px/1.6 var(--ad-font-sans); -webkit-font-smoothing:antialiased; }
    button,input,select,textarea { font:inherit; color:inherit; }
    button { cursor:pointer; }
    button:disabled { cursor:not-allowed; opacity:.5; }
    button,a,input,select,summary { -webkit-tap-highlight-color:transparent; }
    button { border:0; background:none; }
    a { color:var(--ad-route); text-decoration:none; }
    button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,[tabindex="-1"]:focus-visible { outline:2px solid var(--ad-route); outline-offset:3px; }
    :focus:not(:focus-visible) { outline:none; }
    h1,h2,h3,p { margin:0; }
    .icon { width:18px; height:18px; flex:none; fill:none; stroke:currentColor; stroke-width:1.65; stroke-linecap:round; stroke-linejoin:round; vertical-align:middle; }
    .icon.sm { width:15px; height:15px; }
    .muted { color:var(--ad-ink-tertiary); }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    .skip { position:fixed; top:-60px; left:20px; z-index:100; padding:10px 16px; border-radius:8px; background:var(--ad-route); color:#fff; }
    .skip:focus { top:12px; }
    .icon-button { display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:8px; color:var(--ad-ink-secondary); flex:none; }
    .icon-button:hover { background:var(--ad-surface-subtle); color:var(--ad-ink); }
    .text-button { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:32px; padding:4px 7px; border-radius:6px; font-size:13px; }
    .text-button:hover { background:var(--ad-surface-subtle); }
    .blue { color:var(--ad-route); }
    .button { display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:8px 14px; min-height:38px; background:var(--ad-surface); border:1px solid var(--ad-border); border-radius:8px; font-weight:500; font-size:13px; }
    .button:hover { border-color:#aaaeb4; background:var(--ad-surface-quiet); }
    .button.primary { color:#fff; background:var(--ad-route); border-color:var(--ad-route); }
    .button.primary:hover { background:var(--ad-route-hover); }
    .topbar { height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 24px; border-bottom:1px solid var(--ad-border-soft); background:#fff; position:relative; z-index:20; }
    .team-button { display:flex; gap:11px; align-items:center; min-height:40px; padding:3px 6px 3px 0; border-radius:8px; font-weight:600; letter-spacing:-.15px; }
    .team-mark { display:grid; place-items:center; width:30px; height:32px; color:var(--ad-route); }
    .team-mark .icon { width:26px; height:28px; stroke-width:1.8; }
    .topbar-actions { display:flex; gap:16px; align-items:center; }
    .avatar { display:inline-grid; place-items:center; width:32px; height:32px; background:#e9ecef; border:1px solid #dfe3e6; border-radius:50%; font-size:12px; font-weight:600; color:#505861; flex:none; }
    .avatar.me { background:var(--ad-route-soft); color:var(--ad-route-ink); border-color:#d9e7f7; }
    .notification-button { position:relative; }
    .notification-button::after { content:""; position:absolute; right:8px; top:7px; width:5px; height:5px; background:var(--ad-route); border-radius:50%; border:1px solid #fff; }
    .workspace { display:grid; grid-template-columns:var(--sidebar-width) minmax(0,1fr); height:calc(100dvh - 64px); }
    .sidebar { display:flex; flex-direction:column; min-height:0; background:var(--ad-sidebar); border-right:1px solid var(--ad-border-soft); padding:20px 14px 12px; }
    .sidebar-tools { display:flex; align-items:center; gap:6px; position:relative; margin:0 2px 14px; }
    .search-shell { display:flex; align-items:center; gap:7px; background:var(--ad-surface); border:1px solid var(--ad-border-soft); border-radius:8px; min-width:0; height:36px; padding:0 10px; flex:1; color:var(--ad-ink-tertiary); }
    .search-shell:focus-within { border-color:var(--ad-route); }
    .search-shell input { border:0; outline:none; width:100%; min-width:0; background:transparent; font-size:13px; }
    .search-shell input::placeholder { color:var(--ad-ink-tertiary); }
    .sidebar-tools .icon-button { width:32px; height:36px; }
    .sidebar-tools .is-filtered { color:var(--ad-route); background:var(--ad-route-soft); }
    .home-button { display:flex; align-items:center; gap:10px; width:100%; min-height:42px; padding:8px 12px; border-radius:8px; text-align:left; font-weight:600; margin-bottom:15px; }
    .home-button[aria-current="page"] { color:var(--ad-route-ink); background:var(--ad-route-soft); }
    .home-button .home-dot { margin-left:auto; width:5px; height:5px; border-radius:50%; background:var(--ad-route); }
    .home-button:not([aria-current="page"]) .home-dot { display:none; }
    .index-scroll { flex:1; min-height:0; overflow:auto; scrollbar-width:thin; }
    .tag-group { margin:0 0 16px; }
    .group-toggle { display:flex; align-items:center; width:100%; min-height:32px; gap:7px; padding:4px 10px; text-align:left; font-size:12px; color:var(--ad-ink-secondary); }
    .group-toggle .chevron { margin-left:auto; transition:transform 120ms ease; }
    .group-toggle[aria-expanded="false"] .chevron { transform:rotate(-90deg); }
    .group-count { margin-left:4px; color:var(--ad-ink-tertiary); font-family:var(--ad-font-mono); font-size:11px; }
    .task-index-button { width:100%; min-height:40px; padding:9px 12px 9px 32px; font-size:13px; text-align:left; border-radius:7px; line-height:1.55; overflow-wrap:anywhere; }
    .task-index-button:hover { background:#edeeed; }
    .task-index-button[aria-current="page"] { background:var(--ad-route-soft); color:var(--ad-route-ink); font-weight:600; }
    .sidebar-bottom { padding:10px 3px 0; }
    .sidebar-bottom button { display:flex; justify-content:flex-start; gap:9px; width:100%; color:var(--ad-ink-secondary); }
    .filter-chips { display:flex; flex-wrap:wrap; gap:5px; margin:0 4px 10px; }
    .filter-chip { display:inline-flex; align-items:center; gap:3px; max-width:100%; padding:2px 5px 2px 8px; background:#fff; border:1px solid var(--ad-border-soft); border-radius:6px; font-size:11px; }
    .filter-chip button { display:grid; place-items:center; width:24px; height:24px; }
    .filter-popover { position:absolute; left:0; top:44px; z-index:50; width:270px; padding:15px; border:1px solid var(--ad-border-soft); border-radius:12px; background:#fff; box-shadow:0 10px 40px #17191c1a; max-height:min(610px,75vh); overflow:auto; }
    .popover-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; font-weight:600; }
    .filter-popover fieldset { border:0; padding:10px 0; margin:0; }
    .filter-popover fieldset + fieldset { border-top:1px solid var(--ad-border-soft); }
    .filter-popover legend { padding:0; font-size:12px; color:var(--ad-ink-tertiary); }
    .filter-option { display:flex; align-items:center; gap:8px; min-height:35px; font-size:13px; cursor:pointer; padding:3px 3px; }
    input[type="checkbox"] { accent-color:var(--ad-route); width:15px; height:15px; margin:0 3px 0 0; }
    .filter-foot { display:flex; justify-content:space-between; border-top:1px solid var(--ad-border-soft); padding-top:9px; }
    .main-scroll { overflow:auto; min-width:0; background:var(--ad-surface-quiet); scrollbar-width:thin; }
    .page { max-width:1136px; padding:32px 44px 20px; margin:0 auto; }
    .page-heading { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:23px; }
    .heading-title { display:flex; align-items:center; gap:12px; }
    h1 { font-size:28px; line-height:1.35; font-weight:650; letter-spacing:-.8px; }
    .sample-badge { padding:1px 7px; font-size:10px; font-weight:500; letter-spacing:.3px; color:var(--ad-ink-tertiary); border:1px solid var(--ad-border); border-radius:4px; background:#fff; white-space:nowrap; }
    .scope-line { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:11px; font-size:12px; color:var(--ad-ink-secondary); }
    .scope-dot { color:#b7b9bd; }
    .date-block { text-align:right; flex:none; padding-top:2px; }
    .date-block .date { display:flex; align-items:center; justify-content:flex-end; gap:7px; font-size:13px; }
    .date-block .asof { display:block; margin-top:5px; font-size:11px; color:var(--ad-ink-tertiary); }
    .work-intro { font-size:13px; color:var(--ad-ink-secondary); margin:0 0 16px; }
    .work-intro strong { font-weight:600; color:var(--ad-ink); }
    .quick-filters { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
    .quick-filter { position:relative; text-align:left; padding:14px 18px 12px; border:1px solid var(--ad-border-soft); background:#fff; border-radius:10px; transition:background 140ms ease,border-color 140ms ease; }
    .quick-filter:hover { border-color:#b8cde8; }
    .quick-filter[aria-pressed="true"] { border-color:#b9d2f4; background:#f0f6fe; }
    .quick-filter-top { display:flex; align-items:center; gap:8px; color:var(--ad-ink-secondary); font-size:13px; font-weight:500; }
    .quick-filter[aria-pressed="true"] .quick-filter-top { color:var(--ad-route-ink); }
    .quick-number { font-size:29px; font-weight:550; letter-spacing:-1px; margin-left:auto; line-height:1; color:var(--ad-ink); font-variant-numeric:tabular-nums; }
    .quick-filter[aria-pressed="true"] .quick-number { color:var(--ad-route-ink); }
    .quick-filter-sub { display:block; font-size:11px; color:var(--ad-ink-tertiary); margin-top:11px; }
    .classification-note { display:flex; justify-content:flex-end; align-items:center; gap:5px; margin:8px 1px 20px; color:var(--ad-ink-tertiary); font-size:11px; }
    .section-heading { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; }
    h2 { font-size:17px; letter-spacing:-.25px; font-weight:600; }
    .section-heading-left { display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
    .section-count { font-size:12px; color:var(--ad-ink-tertiary); }
    .list-controls { display:flex; align-items:center; gap:9px; }
    .all-button { color:var(--ad-ink-secondary); border:1px solid transparent; }
    .all-button[aria-pressed="true"] { background:#fff; border-color:var(--ad-border-soft); color:var(--ad-route-ink); }
    .list-controls select { font-size:12px; border:0; background:transparent; padding:5px 3px; max-width:130px; }
    .action-list { background:#fff; border:1px solid var(--ad-border-soft); border-radius:12px; overflow:clip; }
    .action-row { padding:18px 24px 12px; position:relative; }
    .action-row + .action-row { border-top:1px solid var(--ad-border-soft); }
    .action-row:hover { background:#fcfdff; }
    .row-heading { display:flex; align-items:flex-start; gap:10px; margin-bottom:9px; }
    .role-label { display:inline-flex; align-items:center; justify-content:center; min-width:32px; height:21px; font-size:10px; letter-spacing:.3px; border:1px solid var(--ad-border-soft); border-radius:4px; background:var(--ad-surface-quiet); color:var(--ad-ink-secondary); margin-top:2px; flex:none; }
    .task-title { text-align:left; padding:0; font-size:14px; font-weight:600; line-height:1.65; }
    .task-title:hover { color:var(--ad-route); }
    .deadline { font-size:11px; white-space:nowrap; margin-left:auto; padding-top:3px; color:var(--ad-ink-tertiary); }
    .deadline.today { color:var(--ad-inference); }
    .deadline.overdue { color:var(--ad-danger); }
    .row-body { padding-left:42px; }
    .next-action { display:flex; align-items:flex-start; gap:8px; font-size:16px; font-weight:550; letter-spacing:-.2px; line-height:1.65; }
    .next-action .icon { width:16px; height:16px; color:var(--ad-route); margin-top:5px; }
    .reason { margin-top:5px; font-size:12px; color:var(--ad-ink-secondary); line-height:1.8; }
    .reason .signal { font-weight:500; }
    .signal.conflict { color:var(--ad-danger); }
    .signal.blocked { color:var(--ad-inference); }
    .signal.unknown { color:var(--ad-ink-secondary); }
    .row-bottom { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:10px; }
    .evidence-details { flex:1; min-width:0; }
    summary { cursor:pointer; list-style:none; }
    summary::-webkit-details-marker { display:none; }
    .evidence-details > summary { display:inline-flex; align-items:center; gap:5px; min-height:28px; color:var(--ad-ink-tertiary); font-size:11px; border-radius:4px; }
    .evidence-details > summary:hover { color:var(--ad-route); }
    .evidence-details > summary .icon { width:13px; height:13px; }
    details[open] > summary .disclosure-chevron { transform:rotate(90deg); }
    .open-task { color:var(--ad-route); font-size:12px; white-space:nowrap; min-height:28px; padding:2px 0 2px 8px; }
    .open-task:hover { color:var(--ad-route-hover); }
    .open-task .icon { width:14px; height:14px; margin-left:3px; }
    .evidence-list { display:grid; gap:7px; margin:8px 0 3px; padding:12px 14px; background:var(--ad-surface-quiet); border-left:2px solid #d9e7f8; border-radius:0 5px 5px 0; }
    .evidence-link { display:flex; align-items:flex-start; gap:7px; text-align:left; font-size:12px; padding:3px 0; line-height:1.65; color:var(--ad-ink-secondary); }
    .evidence-link:hover { color:var(--ad-route); }
    .evidence-link .icon { width:14px; height:14px; margin-top:3px; }
    .evidence-link small { display:block; color:var(--ad-ink-tertiary); font-size:10px; }
    .conflict-hint { display:flex; align-items:center; gap:7px; font-size:12px; margin:12px 1px 0; color:var(--ad-ink-secondary); }
    .conflict-hint .icon { color:var(--ad-danger); width:15px; height:15px; }
    .conflict-hint button { color:var(--ad-route); font-size:12px; padding:5px; margin-left:auto; white-space:nowrap; }
    .work-footnote { color:var(--ad-ink-tertiary); font-size:11px; margin:13px 1px 22px; }
    .secondary-items { border-top:1px solid var(--ad-border-soft); margin-top:24px; }
    .secondary-disclosure { border-bottom:1px solid var(--ad-border-soft); }
    .secondary-disclosure > summary { min-height:49px; display:flex; gap:8px; align-items:center; font-size:12px; color:var(--ad-ink-secondary); }
    .secondary-disclosure > summary .icon { width:15px; height:15px; }
    .secondary-disclosure .disclosure-chevron { margin-left:auto; }
    .secondary-disclosure .tiny-count { font-size:11px; color:var(--ad-ink-tertiary); margin-left:2px; }
    .disclosure-caption { font-size:11px; color:var(--ad-ink-tertiary); margin-left:auto; }
    .secondary-disclosure:has(.disclosure-caption) .disclosure-chevron { margin-left:2px; }
    .secondary-content { padding:0 0 14px 23px; font-size:12px; }
    .change-item { display:flex; align-items:flex-start; gap:16px; padding:8px 0; }
    .change-item time { flex:none; font-family:var(--ad-font-mono); font-size:10px; color:var(--ad-ink-tertiary); padding-top:2px; }
    .change-item button { text-align:left; padding:0; color:var(--ad-ink-secondary); }
    .change-item button:hover { color:var(--ad-route); }
    .pending-item { display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .pending-item small { display:block; margin-top:2px; color:var(--ad-ink-tertiary); }
    .prototype-footer { display:flex; align-items:center; gap:12px; margin-top:26px; padding-top:15px; color:var(--ad-ink-tertiary); font-size:10px; }
    .prototype-footer > span { margin-right:auto; }
    .prototype-footer .text-button { font-size:11px; color:var(--ad-ink-secondary); }
    .prototype-footer select { border:1px solid var(--ad-border-soft); background:transparent; border-radius:6px; padding:4px 6px; max-width:140px; font-size:11px; }
    .notice { display:flex; align-items:flex-start; gap:9px; margin-bottom:21px; padding:12px 14px; border:1px solid #e7d7b9; border-radius:8px; font-size:12px; background:#fffcf5; color:var(--ad-inference); }
    .notice .icon { margin-top:2px; width:16px; height:16px; }
    .notice small { display:block; color:var(--ad-ink-secondary); font-size:11px; margin-top:3px; }
    .notice button { color:var(--ad-route); font-size:11px; padding:0; margin-left:auto; flex:none; }
    .empty-state { text-align:center; padding:58px 22px; background:#fff; border:1px solid var(--ad-border-soft); border-radius:12px; }
    .empty-icon { margin:0 auto 14px; display:grid; place-items:center; width:44px; height:44px; border-radius:12px; background:var(--ad-surface-subtle); color:var(--ad-ink-tertiary); }
    .empty-state h2 { font-size:17px; }
    .empty-state p { font-size:12px; color:var(--ad-ink-secondary); max-width:390px; margin:9px auto 18px; }
    .sidebar-empty { padding:20px 12px; color:var(--ad-ink-tertiary); font-size:12px; }
    .skeleton { display:block; height:12px; width:65%; border-radius:4px; background:#eceeed; margin:15px 0; }
    .skeleton.short { width:38%; }
    .skeleton.wide { width:85%; }
    .loading-rows { padding:20px 25px; border:1px solid var(--ad-border-soft); background:#fff; border-radius:12px; }
    .loading-row + .loading-row { border-top:1px solid var(--ad-border-soft); padding-top:20px; margin-top:25px; }
    .back-link { display:inline-flex; align-items:center; gap:7px; color:var(--ad-ink-secondary); padding:4px 0; min-height:32px; margin-bottom:20px; font-size:12px; }
    .back-link:hover { color:var(--ad-route); }
    .detail-heading h1 { font-size:25px; letter-spacing:-.5px; margin-bottom:11px; }
    .detail-goal { color:var(--ad-ink-secondary); font-size:13px; line-height:1.8; }
    .detail-meta { display:flex; flex-wrap:wrap; gap:18px; align-items:center; margin-top:20px; font-size:12px; }
    .detail-meta > span { display:inline-flex; align-items:center; gap:7px; }
    .detail-meta .avatar { width:22px; height:22px; font-size:9px; }
    .status-dot { display:inline-block; width:6px; height:6px; background:#008af5; border-radius:50%; }
    .criteria { margin-top:15px; font-size:12px; color:var(--ad-ink-secondary); }
    .criteria summary { display:flex; align-items:center; gap:5px; min-height:30px; }
    .criteria ol { margin:8px 0 0; padding-left:21px; }
    .criteria li { padding:3px 0; }
    .situation { border-top:1px solid var(--ad-border-soft); border-bottom:1px solid var(--ad-border-soft); padding:25px 0; margin:23px 0; }
    .situation h2 { font-size:15px; margin-bottom:10px; }
    .situation-lede { font-size:14px; line-height:1.9; }
    .situation-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:23px; margin-top:20px; }
    .situation-grid section + section { border-left:1px solid var(--ad-border-soft); padding-left:23px; }
    .situation-grid h3 { color:var(--ad-ink-tertiary); font-size:11px; font-weight:500; margin-bottom:7px; }
    .situation-grid p { font-size:12px; color:var(--ad-ink-secondary); line-height:1.9; }
    .situation-source { font-size:10px; color:var(--ad-ink-tertiary); margin-top:15px; }
    .detail-tabs { display:flex; align-items:center; gap:26px; border-bottom:1px solid var(--ad-border-soft); }
    .detail-tab { min-height:44px; padding:8px 0 12px; font-size:13px; border-bottom:2px solid transparent; margin-bottom:-1px; color:var(--ad-ink-secondary); }
    .detail-tab[aria-selected="true"] { border-bottom-color:var(--ad-route); color:var(--ad-route); font-weight:600; }
    .detail-tab small { color:var(--ad-ink-tertiary); margin-left:4px; font-size:10px; }
    .detail-panel { min-height:190px; padding:22px 0; }
    .source-record { padding:17px 18px; background:#fff; border:1px solid var(--ad-border-soft); border-radius:8px; margin-bottom:12px; scroll-margin-top:20px; }
    .source-record.located { border-color:#a9c9f2; background:#f3f8ff; box-shadow:0 0 0 2px #e7f1fd; }

      if(!task || unavailable()) { state.view='home'; state.selected=null; renderHome(); return; }
      const due=deadline(task), owner=task.ownerId===CURRENT_USER.id?CURRENT_USER.name:'周航';
      const next=state.scenario==='stale'?'旧建议已过期，请从当前记录重新核对下一步。':task.next||'当前记录不足以给出明确的下一步，需本人核对。';
      $('#page').innerHTML=`<button class="back-link" data-home>${icon('back','sm')}我的工作</button><span class="muted" style="font-size:10px;margin-left:12px">同一任务上下文 · 只读设计演示</span>${notice()}<header class="detail-heading"><h1 id="page-heading" tabindex="-1">${escapeHtml(task.title)}</h1><p class="detail-goal">${escapeHtml(task.goal)}</p><details class="criteria"><summary>${icon('chevron','sm disclosure-chevron')}完成标准${task.criteria.length?` · ${task.criteria.length} 条`:' · 尚未提供'}</summary>${task.criteria.length?`<ol>${task.criteria.map(criterion=>`<li>${escapeHtml(criterion)}</li>`).join('')}</ol>`:'<p>当前任务没有提供完成标准，不填入通用示例。</p>'}</details><div class="detail-meta"><span><span class="avatar me">${owner.slice(0,1)}</span>${owner}负责</span><span><i class="status-dot" style="background:${task.status==='已完成'?'#24735a':task.status==='受阻'?'#8a5a13':'#008af5'}"></i>${task.status}</span><span class="${due.className}">${icon('calendar','sm')}${due.text}</span><span class="muted">预计投入：暂无法估算</span></div>${task.pendingOwnerId?`<p class="detail-note">负责人提议待接受。当前有效负责人仍是${owner}，本页不会代为接受或转移责任。</p>`:''}</header><section class="situation"><h2>当前情况</h2><p class="situation-lede">${escapeHtml(task.reason)}</p><div class="situation-grid"><section><h3>已交付与剩余</h3><p>${escapeHtml(task.delivered)} ${escapeHtml(task.remaining)}</p></section><section><h3>需要关注</h3><p>${task.signal?escapeHtml(task.signal)+'。':''}${escapeHtml(task.reason)}</p></section><section><h3>下一步 · ${task.role}</h3><p>${escapeHtml(next)}</p></section></div><p class="situation-source">来源：本页下方 ${task.sources.length} 条示例记录；${task.sources.length?'截至 '+fullDate(task.sources.map(s=>s.at).sort().at(-1)):'缺少可定位记录'}。状态不等于验收结论。</p></section><div class="detail-tabs" role="tablist" aria-label="任务内容">${[['discussion','讨论'],['children','子任务'],['file','文件'],['activity','活动']].map(([value,label])=>`<button class="detail-tab" id="tab-${value}" role="tab" aria-selected="${state.tab===value}" tabindex="${state.tab===value?'0':'-1'}" aria-controls="detail-panel" data-tab="${value}">${label}<small>${value==='children'?(task.children||[]).length:task.sources.filter(s=>s.kind===value).length}</small></button>`).join('')}</div><section class="detail-panel" id="detail-panel" role="tabpanel" aria-labelledby="tab-${state.tab}" tabindex="0">${detailPanel(task)}</section><p class="detail-note">这里只演示工作台进入原任务与来源定位。正式产品复用原详情，不新增另一份任务或独立诊断页；未提供真实趋势，因此不画燃起图。</p>${footer()}`;
    }
    function detailPanel(task) {
      if(state.tab==='children') return task.children?.length?task.children.map(child=>`<div class="child-row"><span>${escapeHtml(child.title)}<br><small>${escapeHtml(child.owner)}负责</small></span><span>${child.status}</span></div>`).join(''):'<p class="panel-empty">当前任务没有子任务，不为此补拆。</p>';
      const sources=task.sources.filter(source=>source.kind===state.tab);
      if(!sources.length) return `<p class="panel-empty">当前尚未提供${state.tab==='discussion'?'讨论':state.tab==='file'?'文件':'变更'}记录；没有记录不代表没有进展。</p>`;
      return sources.map(source=>`<article class="source-record ${state.locatedSource===source.id?'located':''}" id="record-${source.id}" tabindex="-1">${state.locatedSource===source.id?'<div class="source-located-label">已定位到这条依据</div>':''}<div class="source-head"><span>${escapeHtml(source.title)}${source.version?' · '+source.version:''}<span class="muted"> · ${source.by}</span></span><time datetime="${source.at}">${fullDate(source.at)} · 示例</time></div><p>${escapeHtml(source.text)}</p></article>`).join('');
    }
    function renderBoard() {
      const filtered=visibleIndexTasks();
      $('#page').innerHTML=`<button class="back-link" data-home>${icon('back','sm')}我的工作</button><header class="page-heading"><div><div class="heading-title"><h1 id="page-heading" tabindex="-1">任务看板</h1><span class="sample-badge">示例</span></div><p class="scope-line">与左侧任务索引共用搜索和筛选 · ${filtered.length} 项</p></div><button class="mobile-index-link" data-mobile-index>${icon('filter','sm')}搜索与筛选</button></header><div class="board">${['未开始','进行中','受阻','已完成'].map(status=>`<section class="board-column"><h2>${status} <span class="muted">${filtered.filter(task=>task.status===status).length}</span></h2>${filtered.filter(task=>task.status===status).map(task=>`<button class="board-task" data-open="${task.id}">${escapeHtml(task.title)}</button>`).join('')||'<span class="muted" style="font-size:11px">暂无匹配任务</span>'}</section>`).join('')}</div>${footer()}`;
    }
    function renderPage() { state.view==='detail'?renderDetail():state.view==='board'?renderBoard():renderHome(); }
    function renderAll() { renderIndex(); renderPage(); }
    function announce(message) { $('#live-status').textContent=message; }
    function rememberHome() {
      if(state.view==='home' && document.body.dataset.mobileIndex!=='true') {
        state.homeScroll=$('#main-content').scrollTop;
        const element=document.activeElement;
        state.returnFocus=element?.dataset.source?{source:element.dataset.source,secondary:element.closest('[data-secondary]')?.dataset.secondary}:element?.dataset.open?{task:element.dataset.open,index:!!element.closest('#task-index')}:null;
      }
    }
    function openTask(id,sourceId=null) {
      if(unavailable() || state.scenario==='empty') return;
      const task=sceneTasks().find(item=>item.id===id); if(!task) return;
      rememberHome();
      state.selected=id; state.view='detail'; state.locatedSource=sourceId;
      state.tab=sourceId?task.sources.find(source=>source.id===sourceId)?.kind||'discussion':'discussion';
      document.body.dataset.mobileIndex='false'; closeFilter(); renderAll();
      requestAnimationFrame(()=>{ const target=sourceId?$(`#record-${sourceId}`):$('#page-heading'); target?.focus({preventScroll:true}); if(sourceId) target?.scrollIntoView({block:'center'}); else $('#main-content').scrollTop=0; });
    }
    function goHome() {
      state.selected=null; state.view='home'; state.locatedSource=null; document.body.dataset.mobileIndex='false'; closeFilter(); renderAll();
      requestAnimationFrame(()=>{
        $('#main-content').scrollTop=state.homeScroll;
        const returned=state.returnFocus;
        const target=returned?.source?document.querySelector(`${returned.secondary?'[data-secondary="'+returned.secondary+'"] ':'.action-list '}[data-source="${returned.source}"]`):returned?.task?document.querySelector(`${returned.index?'#task-index ':'.action-list '}[data-open="${returned.task}"]`):null;
        (target?.getClientRects().length?target:$('#page-heading'))?.focus({preventScroll:true});
      });
    }
    function closeFilter(focus=false) { $('#filter-popover').hidden=true; $('#filter-trigger').setAttribute('aria-expanded','false'); if(focus) $('#filter-trigger').focus(); }
    let dialogReturnFocus=null;
    const designNotes=`<h3>这一页只回答一个问题：我接下来做什么？</h3><p>采用一份行动清单，把任务、下一步、为什么处理和原始依据放在同一阅读路径。风险识别、完成标准检查、协作摘要是行动的依据，不被机械拆成三块 AI 功能区。三个分类直接筛选同一清单，数量交叉、不相加。</p><table><thead><tr><th>保留的信息</th><th>帮助作出的判断</th><th>数据依赖</th></tr></thead><tbody><tr><td>本人范围与时间</td><td>这份清单是否覆盖我的工作？</td><td>稳定成员 ID、有效 ownerId、可见范围、数据时间</td></tr><tr><td>任务与具体下一步</td><td>我现在要执行、协调还是核对？</td><td>任务目标、当前情况、责任与明确行动</td></tr><tr><td>期限与行动理由</td><td>为什么现在看它？能否开始？</td><td>有效期限、真实前置、完成标准及交付依据</td></tr><tr><td>来源、版本与未知</td><td>这个判断能信到什么程度？</td><td>可定位的讨论、文件版本、活动和依赖版本</td></tr><tr><td>可搜索的任务索引</td><td>没被建议的任务在哪里？</td><td>同一本人范围、任务全部标签、状态与搜索</td></tr></tbody></table><h3>参考能力如何落在页面上</h3><ul><li>风险识别 → 明确的前置未交付、期限已过、状态冲突；不由沉默推断停工。</li><li>完成标准检查 → 指出缺少哪一项交付依据，打开对应文件版本；缺证据是待核对，不自动判定失败或验收通过。</li><li>每日协作摘要 → 影响下一步的变化进入相关行动理由，完整变化折叠回看，自动活动不混入人的讨论。</li><li>Agent 接力 → 留在原任务上下文。首页不新增全局运行按钮，也不把连接或心跳当成工作完成。</li></ul><h3>会议方向与现行决定的关系</h3><table><thead><tr><th>会议早期方向</th><th>本稿沿用的后续决定</th><th>仍需确认</th></tr></thead><tbody><tr><td>首页回归纯任务列表</td><td>D-154 / D-156：列表上方“我的工作”，主内容仍以行动列表为主，无注意力地图或通知墙。</td><td>若要取消个人页，由产品负责人确认。</td></tr><tr><td>AI 洞察独立 Tab</td><td>D-142 / D-152：当前情况在任务首屏，讨论／子任务／文件／活动保持同级。本稿不新增诊断 Tab。</td><td>独立深入诊断入口另行确认。</td></tr><tr><td>自然语言对话创建</td><td>D-143 / D-147：沿用 AI 辅助需求工作区，不恢复旧对话或默认空表。</td><td>本稿只保留入口位置，不设计或实现创建解析。</td></tr></tbody></table><h3>刻意不放的内容</h3><p>不放个人总燃起图、任务数完成率、健康分、成员排名或精确排程。EWD 是预计人类总投入，不是剩余投入；没有真实日历和剩余量，不能报告负载、完成概率或“今天可以做完”。有子任务且有有效历史时，燃起图才在原任务详情辅助说明趋势。</p><h3>交互与状态边界</h3><ul><li>搜索、状态／标签多选只影响左侧及看板，个人行动范围不变。标签过滤匹配全部标签，命中多个标签也只展示一次；筛选内 OR、维度间 AND，空选不限。</li><li>待接受负责人提议不计入本人负责数。已完成父任务仍有未结束子项时，保留结果核对事项，不自动重开。</li><li>来源可直接定位到具体讨论、文件版本或活动。返回保留行动分类、展开位置以及左侧搜索、条件和分组折叠。</li><li>右下角可预览无任务、无行动、加载、失败、受限、过期。过期时撤下旧建议；受限时不保留任务名称、数量或来源。</li></ul><p class="source-document">内容依据：用户提供的《TaskDoor AI 协作能力参考》（2026-08-30）与会议纪要；本仓库 agentdoor-task-design Skill、09 我的工作设计及 D-154 / D-156 / D-158 / D-159 / D-160。文件里的“已实现”或测试数量不作为本稿的实测结论。</p><p class="source-document" style="margin-top:12px">交付边界：仅新增这个独立 HTML；全部数据为内存样例，无存储、网络请求、真实 AI 分析、通知发送或任务写入。源文档和产品决定未修改。正式接入必须复用原任务实体、原详情与来源入口，并实施服务端权限过滤。</p>`;
    const infoContent = {
      design:{title:'设计依据与信息取舍',content:designNotes},
      team:{title:'当前团队 · 设计示例',content:'<p>当前展示 TaskDoor 产品团队的界面样例。团队切换沿用已有入口；这份独立设计稿不执行真实组织或权限切换。</p>'},
      account:{title:'林然 · 示例账户',content:'<p>用于演示本人负责范围。有效负责人为林然的任务有 8 项；待接受提议另行呈现。设置与主题仍收在账户菜单，本稿不修改真实账户。</p>'},
      create:{title:'沿用现有任务创建入口',content:'<p>加号进入已有的 AI 辅助需求工作区。本次只设计“我的工作”，不恢复旧对话、不增加默认空白表单，也不创建任何真实任务。</p>'},
      tags:{title:'标签管理 · 二级入口',content:'<p>沿用当前标签管理页面。这份工作台稿只演示标签筛选与展示分组，不修改标签定义、顺序、任务归属或父子关系。</p><p style="margin-top:12px">标签始终选填；“未打标签”是视图状态，不是一个新业务标签。</p>'},
      notifications:{title:'通知仍从顶栏查看',content:'<p>首页不再复制一面通知墙。这个入口沿用原通知面板；本设计稿不读取、发送或标记真实通知，也不把“已读”当成处理完成。</p>'},
      permission:{title:'当前访问说明',content:'<p>这是无权限状态的界面示意。真实接入需要先完成服务端鉴权，再取得本人可见任务。本地按 ownerId 过滤不是生产权限验证。</p><p style="margin-top:12px">权限恢复前不显示旧任务名称、来源正文或历史数量；可以通过页面底部恢复正常示例。</p>'}
    };
    function showInfo(kind) {
      let info=infoContent[kind]; if(!info) return;
      if(unavailable() && ['account','notifications'].includes(kind)) info={title:'当前范围不可用',content:'<p>尚未取得可见范围，不展示先前的任务数量、名称或来源内容。</p>'};
      else if(kind==='account') info={title:'林然 · 示例账户',content:`<p>当前场景中有效负责人为林然的任务有 ${ownedTasks().length} 项。设置与主题沿用账户菜单，本稿不修改真实账户。</p>`};
      dialogReturnFocus=document.activeElement?.closest('#filter-popover')?$('#filter-trigger'):document.activeElement; closeFilter(); $('#dialog-title').textContent=info.title; $('#dialog-content').innerHTML=info.content; $('#context-dialog').showModal(); $('#dialog-close').focus();
    }
    function setScenario(value) {
      state.scenario=value; state.selected=null; state.locatedSource=null; state.view='home'; state.homeScroll=0; state.returnFocus=null; state.expanded.clear(); state.secondaryExpanded.clear();
      state.category=['empty','no-actions','restricted','loading'].includes(value)?'all':'due';
      closeFilter(); if($('#context-dialog').open) $('#context-dialog').close(); renderAll(); $('#main-content').scrollTop=0; announce(`已切换为${scenarios.find(s=>s[0]===value)?.[1]}，仅为设计状态预览`);
    }
    $('#task-search').addEventListener('input',event=>{state.search=event.target.value;renderIndex();if(state.view==='board')renderBoard();});
    $('#filter-trigger').addEventListener('click',()=>{const opening=$('#filter-popover').hidden;if(opening){renderFilter();$('#filter-popover').hidden=false;$('#filter-trigger').setAttribute('aria-expanded','true');}else closeFilter();});
    $('#my-work').addEventListener('click',goHome);
    $('#board-trigger').addEventListener('click',()=>{if(unavailable())return;rememberHome();state.selected=null;state.view='board';document.body.dataset.mobileIndex='false';renderAll();$('#main-content').scrollTop=0;});
    $('#dialog-close').addEventListener('click',()=>$('#context-dialog').close());
    $('#context-dialog').addEventListener('click',event=>{if(event.target===$('#context-dialog')){const rect=event.target.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom) event.target.close();}});
    $('#context-dialog').addEventListener('close',()=>{if(dialogReturnFocus?.isConnected&&dialogReturnFocus.getClientRects().length)dialogReturnFocus.focus({preventScroll:true});else $('#page-heading')?.focus({preventScroll:true});});
    document.addEventListener('click',event=>{
      const target=event.target.closest('button');
      if(!event.target.closest('.sidebar-tools')) closeFilter();
      if(!target)return;
      if(target.dataset.category){state.category=target.dataset.category;renderHome();announce(`${categories.find(c=>c.id===state.category)?.label||'全部事项'}，${actionableTasks().filter(t=>state.category==='all'||t.categories.includes(state.category)).length} 项`);$(`[data-category="${state.category}"]`)?.focus({preventScroll:true});}
      else if(target.dataset.source)openTask(target.dataset.task,target.dataset.source);
      else if(target.dataset.open)openTask(target.dataset.open);
      else if(target.dataset.group){const group=target.dataset.group;state.folded.has(group)?state.folded.delete(group):state.folded.add(group);renderIndex();[...document.querySelectorAll('[data-group]')].find(button=>button.dataset.group===group)?.focus({preventScroll:true});}
      else if(target.dataset.info)showInfo(target.dataset.info);
      else if(target.hasAttribute('data-home'))goHome();
      else if(target.hasAttribute('data-close-filter'))closeFilter(true);
      else if(target.hasAttribute('data-reset-filters')){state.statuses.clear();state.labels.clear();renderFilter();renderIndex();if(state.view==='board')renderBoard();$('[data-reset-filters]')?.focus({preventScroll:true});}
      else if(target.dataset.removeFilter){(target.dataset.kind==='status'?state.statuses:state.labels).delete(target.dataset.removeFilter);renderIndex();renderFilter();if(state.view==='board')renderBoard();$('#filter-trigger').focus();}
      else if(target.hasAttribute('data-mobile-index')||target.hasAttribute('data-focus-index')){rememberHome();if(window.matchMedia('(max-width:900px)').matches)document.body.dataset.mobileIndex='true';$('#task-search').focus();}
      else if(target.hasAttribute('data-normal'))setScenario('normal');
      else if(target.dataset.tab){state.tab=target.dataset.tab;state.locatedSource=null;const scroll=$('#main-content').scrollTop;renderDetail();$('#main-content').scrollTop=scroll;$(`#tab-${state.tab}`)?.focus({preventScroll:true});}
    });
    document.addEventListener('change',event=>{
      if(event.target.id==='scenario-select')setScenario(event.target.value);
      else if(event.target.id==='sort-select'){state.sort=event.target.value;renderHome();$('#sort-select').focus({preventScroll:true});}
      else if(event.target.dataset.filterKind){const set=event.target.dataset.filterKind==='status'?state.statuses:state.labels;event.target.checked?set.add(event.target.value):set.delete(event.target.value);renderIndex();if(state.view==='board')renderBoard();announce('任务索引已更新，我的工作范围不变');}
    });
    document.addEventListener('toggle',event=>{const id=event.target.dataset?.evidence,secondary=event.target.dataset?.secondary;if(id){event.target.open?state.expanded.add(id):state.expanded.delete(id);}if(secondary){event.target.open?state.secondaryExpanded.add(secondary):state.secondaryExpanded.delete(secondary);}},true);
    document.addEventListener('keydown',event=>{
      if(event.key==='Escape'&&!$('#context-dialog').open)closeFilter(true);
      const tab=event.target.closest('[role="tab"]');
      if(tab&&['ArrowRight','ArrowLeft','Home','End'].includes(event.key)){event.preventDefault();const values=['discussion','children','file','activity'];let i=values.indexOf(state.tab);i=event.key==='Home'?0:event.key==='End'?3:(i+(event.key==='ArrowRight'?1:3))%4;state.tab=values[i];state.locatedSource=null;const scroll=$('#main-content').scrollTop;renderDetail();$('#main-content').scrollTop=scroll;$(`#tab-${state.tab}`)?.focus({preventScroll:true});}
    });
    renderAll();
  </script>
</body>
</html>
