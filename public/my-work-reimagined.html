      const copy={empty:['work','还没有你负责的任务','接受任务并成为负责人后，这里会根据目标、承诺与依赖给出建议顺序。'], 'no-actions':['review','目前还无法判断工作顺序','你负责的「帮助中心结构整理」还缺少完成标准、近期进展与交付承诺。信息不足，不代表优先级低或没有工作。'],error:['refresh','暂时无法读取任务','任务服务未返回结果，当前范围和优先顺序未知。请重试，不用旧排序冒充新判断。'],restricted:['lock','无法访问当前团队','当前账号没有该团队的访问权限。这里不展示任务标题、数量或排序依据。']}[state.mode];
      body=`<div class="empty-state"><div class="empty-symbol">${icon(copy[0])}</div><h2>${copy[1]}</h2><p>${copy[2]}</p>${state.mode==='error'?`<button class="text-button" data-retry>${icon('refresh')}重新读取</button>`:state.mode==='no-actions'?'<button class="text-button" data-task="knowledge">查看任务并补充信息 '+icon('arrow')+'</button>':''}</div>`;
    }else{
      body=selected.length?selected.map(actionRow).join(''):'<div class="empty-state"><h2>当前筛选下没有已排定的建议</h2><p>可以清除筛选查看完整顺序。缺少排序依据的工作不等于低优先级。</p><button class="text-button" data-category="all">查看完整顺序 '+icon('arrow')+'</button></div>';
      if(unranked.length)body+=`<section class="unranked-section" aria-labelledby="unranked-heading"><header class="unranked-heading"><h3 id="unranked-heading">待补充排序依据 <span class="mono">${unranked.length}</span></h3><p>不参与当前排序，不代表不重要。</p></header>${unranked.map(actionRow).join('')}</section>`;
    }
    const normal=state.mode==='normal';
    $('#workspace').innerHTML=`<div class="page" id="home-page"><header class="page-header"><div><h1 class="page-title">我的工作</h1><p class="scope-line"><span class="small-avatar">卜</span>${scope}</p></div><div class="header-date"><div class="date-line">9 月 1 日，星期二</div><span class="snapshot-line">示例快照 10:30</span></div></header>${normal?`<div class="work-context"><span>当前职责</span><strong>${esc(WORK_CONTEXT.role)}</strong><span class="context-origin">示例 · 基于已知承诺和协作记录</span></div>`:''}<div class="priority-toolbar"><div><h2 id="priority-heading">建议优先顺序</h2><p>${normal?'先做什么，接着做什么，以及为什么。':'需要可用记录，才能给出可靠的顺序。'}</p></div>${normal?`<div class="priority-controls"><button class="priority-help" data-priority-help>排序规则</button><label class="sr" for="priority-filter">筛选建议优先顺序</label><select id="priority-filter" class="priority-filter">${TAB_DEFS.map(([id,label])=>`<option value="${id}" ${state.category===id?'selected':''}>${label}</option>`).join('')}</select></div>`:''}</div><section id="action-list" aria-labelledby="priority-heading">${normal?'<div class="column-head priority-grid" aria-hidden="true"><div>顺序</div><div>任务 · 建议动作</div><div>AI 判断依据<span class="column-caption">展开查看事实与来源</span></div><div>任务期限</div></div>':''}${body}</section><footer class="list-footer"><span>${normal?`已排 ${model.ranked.length} 项 · ${model.unknown.length} 项待补依据 · ${model.inactive.length} 项已结束且无已知冲突${state.category!=='all'?'；筛选保留原顺位':''}`:'排序仅在信息可用时生成。'}</span><span>建议不等于承诺，不自动修改任务。</span></footer></div>`;
  }
  function recordMarkup(task,source){return `<article class="detail-record ${state.source===source.id?'record-target':''}" id="record-${source.id}"><div class="record-author">${icon(source.tab==='files'?'file':source.tab==='discussion'?'coordinate':'review')}<span>${esc(source.type)}</span><time>${esc(source.at)}</time></div><p>${esc(source.text)}</p></article>`;}
  function renderDetail(){
    const task=ownedTasks().find(t=>t.id===state.detail);if(!task){state.detail=null;renderHome();return;}
    const tab=state.detailTab==='criteria'?'discussion':state.detailTab;
    const records=task.sources.filter(s=>s.tab===tab);let content=records.map(s=>recordMarkup(task,s)).join('');
    if(!content)content=`<div class="detail-record"><p>${{discussion:'暂无人的讨论记录。系统变更记录请在「活动」查看。',children:'当前示例没有子任务记录。不据此推断真实任务的拆分情况。',files:'暂无可查看的交付文件记录。',activity:'暂无可查看的系统变更记录。'}[tab]}</p></div>`;
    if(tab==='discussion')content+='<form class="discussion-composer" id="discussion-form"><label class="sr" for="discussion-text">写下你的讨论</label><textarea id="discussion-text" placeholder="围绕这项任务，写下需要沟通的事…" required>'+esc(state.drafts[task.id]||'')+'</textarea><div class="composer-bottom"><span>仅演示讨论交互，不会真实发送。</span><button class="primary-button" type="submit">发送讨论</button></div></form>';
    $('#workspace').innerHTML=`<div class="page" id="detail-page"><button class="back-button" data-home>${icon('back')}返回我的工作</button><div class="breadcrumb">任务 / ${esc(task.name)}</div><header class="detail-heading"><h1>${esc(task.name)}</h1><p class="detail-goal">${esc(task.goal)}</p><div class="detail-props"><span><span class="task-mark ${task.status==='已完成'?'done':''}"></span>${esc(task.status)}</span><span>${icon('coordinate')}卜佳菲</span><span>${icon('calendar')}${task.due?esc(task.due.slice(0,10)+' '+task.due.slice(11,16)):'未设置期限'}</span><span>预计投入：暂无有效估算</span></div><details class="criteria" open><summary>完成标准 · ${task.criteria.length?task.criteria.length+' 条':'尚未明确'}</summary>${task.criteria.length?`<ul>${task.criteria.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:'<p style="margin-top:13px">尚无明确的完成标准；已有记录不能自动视为完成证明。</p>'}${task.sources.filter(s=>s.tab==='criteria').map(s=>recordMarkup(task,s)).join('')}</details></header><section class="current-situation"><div class="section-caption">当前情况 · ${state.mode==='stale'?'记录已过期':'截至示例快照 09.01 10:30'}</div><h2>${task.action?esc(task.fact+task.gap):'近期记录不足，暂时无法判断进展与剩余工作。'}</h2>${task.action&&state.mode!=='stale'?`<p>下一步：<span class="text-highlight">${esc(recommendation(task)?.title||task.action)}</span> · ${esc(task.kindLabel)}</p><details style="margin-top:12px"><summary class="evidence-toggle">查看行动依据 · ${task.sources.length} 条记录</summary><div class="evidence-panel">${evidence(task,true)}</div></details>`:state.mode==='stale'?'<p>快照已经过期。先补充最新记录，再判断下一步；不沿用旧行动建议。</p>':'<p>建议先明确完成标准，补充最近的交付与阻塞信息。</p>'}</section><div class="detail-tabs" role="tablist" aria-label="任务内容">${[['discussion','讨论'],['children','子任务'],['files','文件'],['activity','活动']].map(([id,name])=>`<button class="detail-tab" id="detail-tab-${id}" role="tab" data-detail-tab="${id}" aria-controls="detail-content" aria-selected="${tab===id}" tabindex="${tab===id?'0':'-1'}">${name}</button>`).join('')}</div><section id="detail-content" role="tabpanel" aria-labelledby="detail-tab-${tab}">${content}</section><p class="inference-note" style="margin-top:26px">设计稿中的详情承接示意。示例记录不代表实际交付或验收，不产生业务修改。</p></div>`;
  }
  function setIndex(open){if(open&&!state.indexOpen&&!state.detail)state.homeScroll=$('#workspace').scrollTop;state.indexOpen=open;document.body.dataset.index=String(open);$('#mobile-index').setAttribute('aria-expanded',String(open));$('#mobile-index-label').textContent=open?'返回工作内容':'任务索引';if(!open&&!state.detail)$('#workspace').scrollTop=state.homeScroll;}
  function openTask(id,tab='discussion',source=null){if(!state.detail&&!state.indexOpen)state.homeScroll=$('#workspace').scrollTop;state.detail=id;state.detailTab=tab;state.source=source;setIndex(false);closePopovers();renderIndex();renderDetail();$('#workspace').scrollTop=0;$('#workspace').focus({preventScroll:true});if(source)requestAnimationFrame(()=>document.getElementById('record-'+source)?.scrollIntoView({block:'center'}));}
  function goHome(){state.detail=null;state.source=null;setIndex(false);closePopovers();renderIndex();renderHome();$('#workspace').scrollTop=state.homeScroll;$('#workspace').focus({preventScroll:true});}
  function selectCategory(category,focus=false){state.category=category;renderHome();if(focus)$('#priority-filter')?.focus();}
  function setMode(mode){state.mode=mode;state.detail=null;state.source=null;state.category='all';state.expanded.clear();state.homeScroll=0;state.statuses.clear();state.labels.clear();state.search='';$('#index-search').value='';$('#preview-mode').value=mode;closePopovers();setIndex(false);renderFilters();renderIndex();renderHome();$('#workspace').scrollTop=0;}
  document.addEventListener('click',event=>{
    const el=event.target.closest('button');if(!el)return;
    if(el.dataset.task){openTask(el.dataset.task,el.dataset.targetTab||'discussion',el.dataset.source||null);return;}
    if(el.hasAttribute('data-home')||el.id==='work-link'){goHome();return;}
    if(el.dataset.category){selectCategory(el.dataset.category,true);return;}
    if(el.hasAttribute('data-priority-help')){showInfo('AI 排序判断如何呈现', '<p>这是有来源的<strong>示例建议</strong>，不是已运行的 AI 排序服务，也不是只按任务到期时间排列。</p><p>结合你的职责，比较明确的交付承诺、对目标的影响、协作阻塞和当前可执行性；任务期限与已约定的沟通窗口一起判断。不因为逾期、任务大或等待人数多就自动置顶。</p><p>顺位表示当前建议先关注哪项工作，不代表前一任务全部完成才能开始下一任务，也不构成精确日程。到约定窗口应重新评估；每一项的具体理由与来源都可查看。</p><p>仅覆盖本人有效负责任务。缺少依据的工作不硬排，不解释为低优先级；未接入真实日历、剩余工时或生产 AI，不计算忙闲、完成概率或个人分数。</p>');return;}
    if(el.dataset.detailTab){state.detailTab=el.dataset.detailTab;state.source=null;const scroll=$('#workspace').scrollTop;renderDetail();$('#workspace').scrollTop=scroll;$(`#detail-tab-${state.detailTab}`).focus({preventScroll:true});return;}
    if(el.dataset.evidence){const id=el.dataset.evidence;state.expanded.has(id)?state.expanded.delete(id):state.expanded.add(id);const open=state.expanded.has(id);$('#evidence-'+id).hidden=!open;el.setAttribute('aria-expanded',String(open));el.innerHTML=judgmentToggle(ownedTasks().find(t=>t.id===id),open);return;}
    if(el.dataset.fold){const label=el.dataset.fold;state.folds.has(label)?state.folds.delete(label):state.folds.add(label);renderIndex();Array.from(document.querySelectorAll('[data-fold]')).find(b=>b.dataset.fold===label)?.focus({preventScroll:true});return;}
    if(el.id==='filter-trigger'){if(!$('#filter-popover').hidden)closePopovers();else{renderFilters();placePopover('filter');}return;}
    if(el.id==='prototype-trigger'){if(!$('#prototype-popover').hidden)closePopovers();else placePopover('prototype');return;}
    if(el.hasAttribute('data-close-popover')){const kind=el.closest('#prototype-popover')?'prototype':'filter';closePopovers();$('#'+kind+'-trigger').focus();return;}
    if(el.hasAttribute('data-reset-filters')){state.statuses.clear();state.labels.clear();renderFilters();renderIndex();document.querySelector('[data-reset-filters]').focus();return;}
    if(el.dataset.removeFilter){state[el.dataset.removeFilter].delete(el.dataset.value);renderFilters();renderIndex();$('#filter-trigger').focus();return;}
    if(el.id==='mobile-index'){setIndex(!state.indexOpen);return;}
    if(el.hasAttribute('data-retry')){setMode('normal');showToast('已恢复示例快照；未请求真实任务服务。');return;}
    if(el.id==='modal-close'){$('#info-modal').close();return;}
    if(el.dataset.info){const restricted=['loading','error','restricted'].includes(state.mode);const copy={team:['当前团队','<p>产品协作团队 · 本原型只演示一个团队。</p><p>实际任务与相似性查询都应限制在当前账号可访问的团队范围。</p>'],notifications:['通知','<p>本次工作台不增加通知聚合。此处保留顶栏通知入口，不用示例通知填满页面。</p>'],account:['卜佳菲 · 示例账号',`<p>${restricted?'当前任务范围未知。':`仅以稳定负责人 ID 筛选，共 ${ownedTasks().length} 项有效负责任务。`}</p><p>自己创建、参与讨论或尚未接受的指派，不计入这里。</p>`],create:['新建任务入口','<p>保留既有任务创建入口。本次只重新设计「我的工作」，不在此扩展创建流程或规划服务。</p><p>本按钮不会创建任务。</p>'],labels:['管理标签','<p>在完整产品中进入已有标签管理页。此处仅演示二级入口，不创建新的标签目录或修改任务。</p>']};const c=copy[el.dataset.info];if(c){closePopovers();showInfo(c[0],c[1]);}return;}
  });
  document.addEventListener('pointerdown',e=>{if(!e.target.closest('.popover,#filter-trigger,#prototype-trigger'))closePopovers();});
  document.addEventListener('change',e=>{if(e.target.dataset.filterType){const set=state[e.target.dataset.filterType];e.target.checked?set.add(e.target.value):set.delete(e.target.value);renderIndex();$('#active-filters').innerHTML=[...state.statuses].map(v=>filterChip(v,'statuses')).concat([...state.labels].map(v=>filterChip(v,'labels'))).join('');$('#filter-trigger').classList.toggle('active',state.statuses.size+state.labels.size>0);}if(e.target.id==='preview-mode')setMode(e.target.value);if(e.target.id==='priority-filter')selectCategory(e.target.value,true);});
  $('#index-search').addEventListener('input',e=>{state.search=e.target.value;renderIndex();});
  document.addEventListener('submit',e=>{if(e.target.id==='discussion-form'){e.preventDefault();showToast('已演示发送动作；内容未发送，也未保存到真实任务。');$('#discussion-text').value='';state.drafts[state.detail]='';}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){const wasPrototype=!$('#prototype-popover').hidden,wasFilter=!$('#filter-popover').hidden;closePopovers();if(wasPrototype)$('#prototype-trigger').focus();else if(wasFilter)$('#filter-trigger').focus();return;}const tab=e.target.closest('[role="tab"]');if(!tab||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const group=[...tab.parentElement.querySelectorAll('[role="tab"]')],index=group.indexOf(tab),next=e.key==='Home'?0:e.key==='End'?group.length-1:(index+(e.key==='ArrowRight'?1:-1)+group.length)%group.length;group[next].click();});
  $('#info-modal').addEventListener('close',()=>{if(document.activeElement===document.body)$('#filter-trigger').focus();});
  document.addEventListener('input',e=>{if(e.target.id==='discussion-text'&&state.detail)state.drafts[state.detail]=e.target.value;});
  window.addEventListener('resize',()=>{closePopovers();if(window.innerWidth>900&&state.indexOpen)setIndex(false);});
  // Keep the task index's original order. Only the recommendation projection is priority-ordered.
  hydrateIcons();renderFilters();renderIndex();renderHome();
</script>
</body>
</html>
