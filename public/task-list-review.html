let visible=tasks.filter(t=>(scope==='all'||(scope==='done'?t.status==='已完成':t.status!=='已完成'))&&(status==='all'||status===t.status)&&(!chosenTags.size||t.tags.some(x=>chosenTags.has(x)))&&t.title.toLowerCase().includes(q));
visible.sort((a,b)=>a.age===null?1:b.age===null?-1:$('sort').value==='recent'?a.age-b.age:b.age-a.age);
$('open-count').textContent=tasks.filter(t=>t.status!=='已完成').length;$('all-count').textContent=tasks.length;$('done-count').textContent=tasks.filter(t=>t.status==='已完成').length;
document.querySelectorAll('[data-scope]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.scope===scope));
$('result-count').textContent=`${visible.length} 项${status!=='all'||chosenTags.size?' · 已筛选':''}`;$('foot-count').textContent=scope==='open'?'已完成任务已隐藏':'包含历史任务';
if(!visible.some(t=>t.id===selected))selected=visible[0]?.id??null;
$('rows').innerHTML=visible.length?visible.map(t=>`<li><button class="row" data-id="${t.id}" aria-current="${t.id===selected}" title="${esc(t.title)}"><span class="row-heading"><span class="task-title">${esc(t.title)}</span></span><span class="metadata">${badge(t)}${t.due?`<span class="due ${t.due.includes('逾期')?'late':''}">${esc(t.due)}</span>`:''}<time class="updated ${t.age!==null&&t.age<1440?'fresh':''}" title="${esc(t.stamp)}" aria-label="最后更新：${esc(t.time)}">${esc(t.time)}</time></span></button><div class="task-tags ${expandedTags.has(t.id)?'expanded':''}" aria-label="任务标签">${(expandedTags.has(t.id)?t.tags:t.tags.slice(0,2)).map(tag=>`<span class="row-tag" title="${esc(tag)}">${esc(tag)}</span>`).join('')}${t.tags.length>2?`<button class="more-tags" data-tags="${t.id}" aria-expanded="${expandedTags.has(t.id)}" aria-label="${expandedTags.has(t.id)?'收起':'展开'}${esc(t.title)}的标签">${expandedTags.has(t.id)?'收起':'+'+(t.tags.length-2)}</button>`:''}</div></li>`).join(''):'<li class="empty"><strong>没有匹配的任务</strong>试试其他关键词，或减少筛选条件。<br><button id="clear-all">清除搜索和筛选</button></li>';
document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.id);render();$('shell').classList.add('show-detail');if(matchMedia('(max-width:620px)').matches)$('back').focus()});
document.querySelectorAll('[data-tags]').forEach(b=>b.onclick=()=>{const id=Number(b.dataset.tags);expandedTags.has(id)?expandedTags.delete(id):expandedTags.add(id);render();document.querySelector(`[data-tags="${id}"]`)?.focus()});
if($('clear-all'))$('clear-all').onclick=()=>{reset();scope='all';render()};renderDetail();renderFilters(visible.length);
}
function renderDetail(){const t=tasks.find(t=>t.id===selected);$('detail').innerHTML=`<div class="breadcrumb"><button class="back" id="back">← 任务列表</button><span>我的任务</span><span>/</span><strong>${t?esc(t.tag):'搜索结果'}</strong></div>`+(t?`<div class="detail-body"><div class="eyebrow">TASK · ${String(t.id).padStart(3,'0')}</div><h2>${esc(t.title)}</h2><div class="detail-meta">${badge(t)}<span class="person"><span class="avatar">岚</span>周岚</span>${t.due?`<span>${esc(t.due)}</span>`:''}${t.tags.map(tag=>`<span class="tag">${esc(tag)}</span>`).join('')}</div><div class="section-nav"><strong>任务概览</strong><span>详情区域示意</span></div><h3 class="section-title">任务说明</h3><p class="description">${esc(t.summary)}</p><h3 class="section-title">最近更新</h3><div class="activity"><small>${esc(t.stamp)}</small><p>${esc(t.action)}</p></div><details class="reference"><summary>查看本次列表设计说明</summary><ul><li>标题最多两行；第二行固定显示状态、截止提示与更新时间。</li><li>默认展示未完成任务，按实际变更时间倒序；标签独立一行，默认最多两个，其余用 +N 展开，也可用于筛选。</li><li>长期未更新的未完成任务仍在列表中，可切换“最久未更新”查找。</li><li>更新来自任务字段、讨论、文件或子任务的实际变更；仅查看任务不改变排序。</li><li>时间不明显示“时间未知”并排在末尾，不推断任务已停滞或已完成。</li><li>“最近更新”不代表“尚未阅读”，本例不添加未读标识。</li></ul></details><p class="sample-note">交互设计示例 · 数据固定于 2026 年 9 月 7 日 16:00，不修改真实任务</p></div>`:'<div class="placeholder">选择一个任务查看详情</div>');$('back').onclick=()=>{$('shell').classList.remove('show-detail');document.querySelector(`[data-id="${selected}"]`)?.focus()}}
function reset(){$('search').value='';$('status').value='all';$('tag').value='all';chosenTags.clear()}
document.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{scope=b.dataset.scope;$('status').value='all';render();$('rows').scrollTop=0});
['search','status','tag','sort'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',()=>{render();$('rows').scrollTop=0}));
$('filter-btn').onclick=()=>{const open=$('filters').hidden;$('filters').hidden=!open;$('filter-btn').setAttribute('aria-expanded',open);if(open)$('close-filter').focus()};
$('reset-filter').onclick=()=>{$('status').value='all';$('tag').value='all';chosenTags.clear();render()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('filters').hidden=true;$('filter-btn').setAttribute('aria-expanded','false');$('shell').classList.remove('show-detail');$('filter-btn').focus()}});
function closeFilters(){$('filters').hidden=true;$('filter-btn').setAttribute('aria-expanded','false')}
function renderFilters(count){
 const status=$('status').value;
 $('status-options').innerHTML=['all','待开始','进行中','已阻塞','已完成'].map(x=>`<button data-status="${x}" aria-pressed="${status===x}">${x==='all'?'不限':badge({status:x})}</button>`).join('');
 document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{$('status').value=b.dataset.status;if(b.dataset.status==='已完成')scope='done';else if(b.dataset.status!=='all'&&scope==='done')scope='open';render();document.querySelector(`[data-status="${b.dataset.status}"]`)?.focus()});
 const names=[...new Set(tasks.flatMap(t=>t.tags))].filter(x=>x.includes($('tag-search').value.trim()));
 $('tag-options').innerHTML=names.length?names.map(x=>`<button data-tag-option="${esc(x)}" aria-pressed="${chosenTags.has(x)}"><span>${esc(x)}</span><span class="tag-count">${chosenTags.has(x)?'✓':tasks.filter(t=>t.tags.includes(x)).length}</span></button>`).join(''):'<p class="no-tags">没有匹配的标签</p>';
 document.querySelectorAll('[data-tag-option]').forEach(b=>b.onclick=()=>{const name=b.dataset.tagOption;chosenTags.has(name)?chosenTags.delete(name):chosenTags.add(name);render();[...document.querySelectorAll('[data-tag-option]')].find(x=>x.dataset.tagOption===name)?.focus()});
 $('filter-result').textContent=`${count} 项任务符合条件`;
 const active=[...(status==='all'?[]:[{label:status,key:'status'}]),...[...chosenTags].map(label=>({label,key:label}))];
 $('active-filters').hidden=!active.length;
 $('active-filters').innerHTML=active.map(x=>`<button data-remove="${esc(x.key)}" aria-label="取消筛选：${esc(x.label)}">${esc(x.label)}<span aria-hidden="true">×</span></button>`).join('');
 document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{b.dataset.remove==='status'?$('status').value='all':chosenTags.delete(b.dataset.remove);render()});
 $('filter-btn').classList.toggle('has-selection',active.length>0);
}
$('tag-search').oninput=()=>renderFilters(document.querySelectorAll('#rows .row').length);
$('close-filter').onclick=()=>{closeFilters();$('filter-btn').focus()};
document.addEventListener('click',e=>{if(!e.composedPath().includes($('filters'))&&!e.composedPath().includes($('filter-btn')))closeFilters()});
$('tag').innerHTML='<option value="all">所有标签</option>'+[...new Set(tasks.flatMap(t=>t.tags))].map(tag=>`<option>${esc(tag)}</option>`).join('');
render();
</script>
</body>
</html>
